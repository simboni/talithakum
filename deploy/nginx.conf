# nginx in front of the Node server: TLS, compression, and nothing else.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/talithakum
#   sudo ln -s /etc/nginx/sites-available/talithakum /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot fill in the certificate lines:
#   sudo certbot --nginx -d talithakumraht.org -d www.talithakumraht.org
#
# Routing deliberately stays in Node. The redirect rules are generated by
# site/build.mjs and read from dist/_redirects at runtime, so translating them
# into nginx would create a second copy to keep in step — and the day they
# disagree, old shared links break silently.

server {
    listen 80;
    listen [::]:80;
    server_name talithakumraht.org www.talithakumraht.org;

    # certbot replaces this with a redirect to https once the cert is issued.
    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talithakumraht.org www.talithakumraht.org;

    # certbot writes these two lines.
    # ssl_certificate     /etc/letsencrypt/live/talithakumraht.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/talithakumraht.org/privkey.pem;

    # Phone photographs go through the admin API as base64. Netlify capped the
    # request at about 4 MB; nothing here has to, but keep a ceiling so a stuck
    # upload cannot fill the disk.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The admin API rate-limits failed sign-ins by address. Without this
        # every attempt looks like it came from 127.0.0.1 and one person
        # guessing wrong locks out everybody.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
