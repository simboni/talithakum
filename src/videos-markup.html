<!-- =========================================================================
     Talitha Kum Kenya — Videos
     Markup only. build-videos.mjs wraps the CSS and JS around this to produce
     elementor/videos-page.html, which is what you paste into Elementor.
     ========================================================================= -->

<div class="tkvid">

  <!-- Filled by the script, and only for users WordPress has marked as
       logged in. Empty for everyone else. -->
  <section id="tkvid-admin" class="tkvid-admin" aria-label="Video publishing panel"></section>

  <header class="tkvid-head">
    <span class="tkvid-eyebrow">Watch</span>
    <h1 class="tkvid-title">Videos</h1>
    <p class="tkvid-lede">
      Awareness films, trainings and testimony from Religious Against Human
      Trafficking &mdash; Kenya. Everything plays here on the page.
    </p>
  </header>

  <div class="tkvid-bar">
    <div class="tkvid-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <label class="tkvid-sr" for="tkvid-search">Search videos</label>
      <input type="search" id="tkvid-search" placeholder="Search videos&hellip;" autocomplete="off">
    </div>
    <div class="tkvid-chips" id="tkvid-chips" role="group" aria-label="Filter by type"></div>
  </div>

  <p class="tkvid-count" id="tkvid-count"></p>
  <p class="tkvid-sr" id="tkvid-live" role="status" aria-live="polite"></p>

  <div id="tkvid-featured" class="tkvid-featured"></div>
  <div id="tkvid-grid" class="tkvid-grid"></div>
  <div id="tkvid-empty"></div>

</div>

<!-- Player. No iframe exists until someone presses play, so no YouTube or
     Vimeo code is loaded on page view. -->
<div class="tkvid tkvid-modal" id="tkvid-modal" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="tkvid-player">
    <div class="tkvid-frame" id="tkvid-frame"></div>
    <div class="tkvid-pbar">
      <div>
        <h2 id="tkvid-ptitle"></h2>
        <p id="tkvid-pmeta"></p>
        <a class="tkvid-out" id="tkvid-pout" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4 11 13"></path><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"></path></svg>
          <span>Watch on the original site</span>
        </a>
      </div>
      <button type="button" class="tkvid-x" data-close aria-label="Close the player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>
</div>

<div class="tkvid tkvid-toasts" role="status" aria-live="polite"></div>
