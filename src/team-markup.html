<!-- =========================================================================
     Talitha Kum Kenya — Team
     Markup only. build-team.mjs wraps the CSS and JS around this to produce
     elementor/team-page.html, which is what you paste into Elementor.
     ========================================================================= -->

<div class="tkteam">

  <!-- Filled by the script, and only for users WordPress has marked as
       logged in. Empty for everyone else. -->
  <section id="tkteam-admin" class="tkteam-admin" aria-label="Team publishing panel"></section>

  <header class="tkteam-head">
    <span class="tkteam-eyebrow">Who we are</span>
    <h1 class="tkteam-title">Our team</h1>
    <p class="tkteam-lede">
      The board and staff of Talitha Kum Kenya, the network of congregations
      working to prevent trafficking and walk with survivors.
    </p>
  </header>

  <div class="tkteam-chips" id="tkteam-chips" role="group" aria-label="Filter by group"></div>

  <p class="tkteam-sr" id="tkteam-live" role="status" aria-live="polite"></p>

  <div id="tkteam-groups"></div>
  <div id="tkteam-empty"></div>

</div>

<!-- Profile. Opens only for someone with a biography. -->
<div class="tkteam tkteam-modal" id="tkteam-modal" role="dialog" aria-modal="true" aria-label="Profile">
  <div class="tkteam-sheet" id="tkteam-sheet"></div>
</div>

<div class="tkteam tkteam-toasts" role="status" aria-live="polite"></div>
