<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var app = $("#app");
  var me = null;
  var dirty = false;          /* an editor or the gallery has unsaved changes */
  var lastPublish = null;

  /* ------------------------------------------------------------------ api */

  function api(path, opts) {
    opts = opts || {};
    return fetch("/api/admin/" + path, {
      method: opts.method || "GET",
      headers: { "content-type": "application/json" },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: "same-origin",
      cache: "no-store",          /* never let a stale list hide something just published */
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) {
          /* Sessions last a week, so this happens. Without it the panel keeps
             drawing signed-in screens and shows "Sign in first" inside a list
             body, with no way back except knowing to reload. */
          if (r.status === 401 && me) { me = null; dirty = false; renderAuth(); throw new Error("Your session has ended — please sign in again"); }
          throw new Error(d.error || ("Request failed (" + r.status + ")"));
        }
        return d;
      });
    }, function () {
      /* A dropped connection otherwise surfaces as "TypeError: Failed to fetch" */
      throw new Error("Could not reach the server — check your connection and try again");
    });
  }

  /* -------------------------------------------------------------- helpers */

  function toast(msg, ok) {
    var t = $("#toast");
    t.innerHTML = "";
    t.appendChild(document.createTextNode(msg));
    var x = document.createElement("button");
    x.className = "x"; x.type = "button"; x.setAttribute("aria-label", "Dismiss");
    x.textContent = "×";
    x.onclick = function () { t.className = "toast"; };
    t.appendChild(x);
    t.className = "toast show " + (ok ? "ok" : "bad");
    clearTimeout(t._h);
    /* Successes fade; failures stay until dismissed, because a message you
       missed is the same as no message. */
    if (ok) t._h = setTimeout(function () { t.className = "toast"; }, 5000);
  }

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var slugify = function (s) {
    return String(s).toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "item";
  };
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  /* The public site writes "12 July 2026"; the panel used to show the raw ISO. */
  function niceDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    if (!m) return String(s || "");
    return Number(m[3]) + " " + MONTHS[Number(m[2]) - 1] + " " + m[1];
  }
  function initials(name) {
    var parts = String(name || "").replace(/^(sr|br|bro|fr|mr|mrs|ms|dr)\.?\s+/i, "").split(/\s+/).filter(Boolean);
    var s = parts.slice(0, 2).map(function (w) { return (w.match(/[a-z0-9]/i) || [""])[0]; }).join("");
    return s.toUpperCase() || "?";
  }
  /* Videos carry a YouTube link but the row had no picture at all. */
  function videoThumb(url) {
    var m = /(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/.exec(String(url || ""));
    return m ? "https://img.youtube.com/vi/" + m[1] + "/mqdefault.jpg" : null;
  }
  function go(hash) { location.hash = hash; }
  function leaving() {
    if (!dirty) return true;
    if (confirm("You have changes that have not been published yet. Leave and lose them?")) { dirty = false; return true; }
    return false;
  }
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  /* --------------------------------------------------------------- schema */

  var THEMES = ["Prevention", "Protection", "Partnership", "Prayer", "Child Trafficking", "Labour Exploitation", "Safe Migration", "Survivor Care", "Digital Safety", "Youth & Schools", "Advocacy", "Faith Formation"];

  var SECTIONS = {
    news: {
      label: "News", nav: "News", single: "story", plural: "stories", idField: "title",
      blurb: "Stories appear on the News page, and the newest three show on the homepage.",
      icon: '<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 8h3v9a2 2 0 0 1-2 2M7 9h7M7 12h7M7 15h4"/>',
      meta: function (d) { return niceDate(d.date) + (d.category ? " · " + d.category : ""); },
      img: function (d) { return d.image; },
      facet: { field: "category", label: "Focus area" },
      groups: [
        { legend: "The story", fields: ["title", "date", "category", "summary"] },
        { legend: "Photograph", fields: ["image"] },
        { legend: "Full text", fields: ["body"] },
      ],
      fields: [
        { n: "title", l: "Headline", w: "string", req: 1, span: 1 },
        { n: "date", l: "Date", w: "date", req: 1 },
        { n: "category", l: "Focus area", w: "select", opts: ["", "Prayer", "Protection", "Prevention", "Partnership & Networking"], hint: "Which of the four Ps this story belongs to" },
        { n: "summary", l: "One-sentence summary", w: "text", req: 1, span: 1, hint: "Shown on the news cards and in search results" },
        { n: "image", l: "Photo", w: "image", span: 1 },
        { n: "body", l: "The story", w: "markdown", req: 1, span: 1, hint: "Blank line between paragraphs. **bold** for emphasis, - for lists." },
      ],
    },
    publications: {
      label: "Publications", nav: "Publications", single: "publication", plural: "publications", idField: "title",
      blurb: "Reports, briefs and manuals that visitors can read or download.",
      icon: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 15h7M9 18h4"/>',
      meta: function (d) { return niceDate(d.date) + (d.type ? " · " + d.type : ""); },
      img: function (d) { return d.cover; },
      facet: { field: "type", label: "Type" },
      groups: [
        { legend: "The publication", fields: ["title", "date", "type", "lang", "summary"] },
        { legend: "The document", fields: ["pdf", "pages"] },
        { legend: "How it is filed", fields: ["themes", "keywords", "issuer"] },
        { legend: "On the website", fields: ["cover", "featured"] },
      ],
      fields: [
        { n: "title", l: "Title", w: "string", req: 1, span: 1 },
        { n: "date", l: "Publication date", w: "date", req: 1 },
        { n: "type", l: "Type", w: "select", req: 1, opts: ["Annual Report", "Policy Brief", "Research Report", "Training Manual", "Awareness Material", "Newsletter", "Case Study", "Prayer Resource"] },
        { n: "lang", l: "Language", w: "select", opts: [["en", "English"], ["sw", "Kiswahili"]] },
        { n: "summary", l: "Short summary", w: "text", req: 1, span: 1 },
        { n: "pdf", l: "PDF file", w: "file", req: 1, span: 1, hint: "The document itself, up to about 4 MB" },
        { n: "pages", l: "Number of pages", w: "number" },
        { n: "themes", l: "Themes (up to three)", w: "multi", opts: THEMES, max: 3, span: 1 },
        { n: "keywords", l: "Keywords", w: "tags", span: 1, hint: "Comma-separated: places, partners, target groups" },
        { n: "issuer", l: "Issuer", w: "string", def: "Talitha Kum Kenya" },
        { n: "cover", l: "Cover image", w: "image", span: 1 },
        { n: "featured", l: "Feature this at the top", w: "bool", span: 1 },
      ],
    },
    videos: {
      label: "Videos", nav: "Videos", single: "video", plural: "videos", idField: "title",
      blurb: "Films and recordings, played from YouTube or Vimeo.",
      icon: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
      meta: function (d) { return niceDate(d.date) + (d.type ? " · " + d.type : ""); },
      img: function (d) { return videoThumb(d.url); },
      facet: { field: "type", label: "Type" },
      groups: [
        { legend: "The video", fields: ["title", "url", "date", "type", "dur"] },
        { legend: "How it is filed", fields: ["themes", "summary"] },
        { legend: "On the website", fields: ["featured"] },
      ],
      fields: [
        { n: "title", l: "Title", w: "string", req: 1, span: 1 },
        { n: "url", l: "Video link", w: "string", req: 1, span: 1, hint: "Paste the YouTube or Vimeo link — share links and Shorts all work" },
        { n: "date", l: "Date", w: "date", req: 1 },
        { n: "type", l: "Type", w: "select", req: 1, opts: ["Awareness Video", "Testimony", "Training", "Event Highlights", "Interview", "Prayer & Reflection", "Documentary", "Public Service Announcement"] },
        { n: "dur", l: "Length", w: "string", hint: "e.g. 4:32 — shown on the thumbnail" },
        { n: "themes", l: "Themes (up to three)", w: "multi", opts: THEMES, max: 3, span: 1 },
        { n: "summary", l: "Short description", w: "text", span: 1 },
        { n: "featured", l: "Feature this at the top", w: "bool", span: 1 },
      ],
    },
    team: {
      label: "Team members", nav: "Team members", single: "person", plural: "people", idField: "name",
      blurb: "The board and staff shown on the Our Team page.",
      icon: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M16 5.6a3 3 0 0 1 0 5M17.5 14.4c1.7.7 2.7 2.2 3 4.6"/>',
      meta: function (d) { return (d.role || "") + " · shown " + ordinal(d.order == null ? 50 : d.order); },
      img: function (d) { return d.photo; },
      person: 1,
      facet: { field: "group", label: "Group" },
      groups: [
        { legend: "The person", fields: ["name", "role", "group", "order"] },
        { legend: "Portrait", fields: ["photo"] },
        { legend: "Biography", fields: ["bio"] },
      ],
      fields: [
        { n: "name", l: "Full name", w: "string", req: 1, span: 1, hint: "Including Sr., Bro., Fr." },
        { n: "role", l: "Designation", w: "string", req: 1, span: 1, hint: "e.g. Board Vice Chair" },
        { n: "group", l: "Group", w: "select", opts: ["Board", "Staff"], def: "Board" },
        { n: "order", l: "Display order", w: "number", def: 50, hint: "Lower comes first: director 5, chair 10, vice chair 20, members 50" },
        { n: "photo", l: "Photograph", w: "image", span: 1, hint: "Portrait orientation works best; without one the card shows initials" },
        { n: "bio", l: "Short biography", w: "text", span: 1, hint: "Only people with a biography are clickable on the page" },
      ],
    },
  };
  function ordinal(n) {
    n = Number(n) || 0;
    var s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  var ICON_GALLERY = '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.5-4.5 3 3L17 11l2.5 2.5"/>';
  var ICON_USERS = '<circle cx="12" cy="7.5" r="3.4"/><path d="M5 19.5c.8-3.8 3.4-5.8 7-5.8s6.2 2 7 5.8"/>';
  var ICON_HOME = '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>';
  var ICON_SEARCH = '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>';
  var SEC_LABELS = { news: "News", publications: "Publications", videos: "Videos", team: "Team members", gallery: "Photo gallery" };

  function icon(d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>"; }

  /* ------------------------------------------------------------------ auth */

  function renderAuth() {
    api("status").then(function (s) {
      var first = !!s.setup;      /* the API reports {setup: true} when no account exists yet */
      app.innerHTML = '<div class="auth"><form class="auth-card" id="af">' +
        '<img src="/uploads/tik-logo.png" alt=""><h1>' + (first ? "Create the first account" : "Talitha Kum Kenya") + "</h1>" +
        '<p class="sub">' + (first ? "This becomes the administrator account for the website." : "Sign in to update the website.") + "</p>" +
        '<div class="err" id="aerr" role="alert"></div>' +
        (first ? '<label class="f" style="margin-bottom:16px"><span class="lbl">Your name</span><input class="in" name="name" required autocomplete="name"></label>' : "") +
        '<label class="f" style="margin-bottom:16px"><span class="lbl">Email</span><input class="in" name="email" type="email" required autocomplete="username"></label>' +
        '<label class="f" style="margin-bottom:16px"><span class="lbl">Password</span><input class="in" name="password" type="password" required autocomplete="' + (first ? "new-password" : "current-password") + '" minlength="8"></label>' +
        '<button class="btn primary" type="submit">' + (first ? "Create account" : "Sign in") + "</button>" +
        (first ? "" : '<p class="auth-note">Forgotten your password? The website administrator can set a new one for you from the Users screen.</p>') +
        "</form></div>";
      $("#af").onsubmit = function (e) {
        e.preventDefault();
        var f = e.target, er = $("#aerr");
        er.className = "err";
        var b = f.querySelector("button"); b.disabled = true;
        api(first ? "setup" : "login", { method: "POST", body: { name: f.name ? f.name.value : undefined, email: f.email.value, password: f.password.value } })
          /* replaceState rather than go(): setting the hash would fire
             hashchange and render a second time, leaving this form's handlers
             bound to a detached element. */
          .then(function (d) { me = d.user; dirty = false; history.replaceState(null, "", location.pathname); route(); })
          .catch(function (err) {
            b.disabled = false;
            /* A second setup submission used to leave a form that could never work */
            if (first && /already/i.test(err.message)) { renderAuth(); return; }
            er.textContent = err.message; er.className = "err show";
          });
      };
      $("#af [name=" + (first ? "name" : "email") + "]").focus();
    }).catch(function () {
      app.innerHTML = '<div class="auth"><div class="auth-card"><h1>Panel unavailable</h1>' +
        '<p class="sub">The website is reachable but the admin service did not answer.</p>' +
        '<button class="btn primary" id="retry" type="button">Try again</button></div></div>';
      $("#retry").onclick = renderAuth;
    });
  }

  /* ----------------------------------------------------------------- shell */

  var counts = {};
  function navItems() {
    var out = [];
    Object.keys(SECTIONS).forEach(function (k) { if (me.sections.indexOf(k) >= 0) out.push({ k: k, label: SECTIONS[k].nav, icon: SECTIONS[k].icon }); });
    if (me.sections.indexOf("gallery") >= 0) out.push({ k: "gallery", label: "Photo gallery", icon: ICON_GALLERY });
    return out;
  }

  function shell(inner, active) {
    var items = navItems();
    var nav = items.map(function (i) {
      return '<button class="nitem' + (active === i.k ? " on" : "") + '" data-nav="' + i.k + '">' + icon(i.icon) +
        '<span class="t">' + esc(i.label) + "</span>" +
        (counts[i.k] != null ? '<span class="count">' + counts[i.k] + "</span>" : "") + "</button>";
    }).join("");

    app.innerHTML =
      '<div class="topbar">' +
        '<img src="/uploads/tik-logo.png" alt="">' +
        '<label class="vh" for="secsel">Go to section</label>' +
        '<select id="secsel">' +
          '<option value="home"' + (active === "home" ? " selected" : "") + '>Home</option>' +
          items.map(function (i) { return '<option value="' + i.k + '"' + (active === i.k ? " selected" : "") + ">" + esc(i.label) + "</option>"; }).join("") +
          (me.role === "admin" ? '<option value="users"' + (active === "users" ? " selected" : "") + ">Users</option>" : "") +
          '<option value="account"' + (active === "account" ? " selected" : "") + ">My account</option>" +
        "</select>" +
        '<button class="more" id="mobilemore" type="button" aria-label="More">⋯</button>' +
      "</div>" +
      '<div class="shell"><nav class="side" aria-label="Sections">' +
        '<div class="brand"><img src="/uploads/tik-logo.png" alt=""><div><b>Talitha Kum</b><span>Admin panel</span></div></div>' +
        '<button class="nitem' + (active === "home" ? " on" : "") + '" data-nav="home">' + icon(ICON_HOME) + '<span class="t">Home</span></button>' +
        '<div class="nav-label">Content</div>' + nav +
        '<div class="nav-label">Settings</div>' +
        (me.role === "admin" ? '<button class="nitem' + (active === "users" ? " on" : "") + '" data-nav="users">' + icon(ICON_USERS) + '<span class="t">Users</span>' + (counts.users != null ? '<span class="count">' + counts.users + "</span>" : "") + "</button>" : "") +
        '<button class="nitem' + (active === "account" ? " on" : "") + '" data-nav="account">' + icon('<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.6l1.9 1.1M17.9 15.3l1.9 1.1M4.2 16.4l1.9-1.1M17.9 8.7l1.9-1.1"/>') + '<span class="t">My account</span></button>' +
        '<div class="foot">' +
          '<button class="nitem" id="viewsite">' + icon('<path d="M14 4h6v6M20 4l-8.5 8.5M18 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5.5"/>') + '<span class="t">View the live site</span></button>' +
          '<button class="nitem" id="logout">' + icon('<path d="M9 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3M16 15l3-3-3-3M19 12H9"/>') + '<span class="t">Sign out</span></button>' +
          '<div class="who"><span class="av">' + esc(initials(me.name)) + "</span><div><b>" + esc(me.name) + "</b><span>" + (me.role === "admin" ? "Administrator" : "Editor") + "</span></div></div>" +
        "</div>" +
      '</nav><main class="main" id="main">' + inner + "</main></div>";

    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (b) {
      b.onclick = function () {
        var k = b.getAttribute("data-nav");
        if (!leaving()) return;
        var want = k === "home" ? "#/" : "#/" + k;
        /* Clicking the section you are already on used to do nothing at all */
        if (location.hash === want || (want === "#/" && !location.hash)) route(); else go(want);
      };
    });
    var sel = $("#secsel");
    if (sel) sel.onchange = function () {
      if (!leaving()) { sel.value = active || "home"; return; }
      go(sel.value === "home" ? "#/" : "#/" + sel.value);
    };
    var more = $("#mobilemore");
    if (more) more.onclick = function () {
      if (confirm("Sign out of the admin panel?")) $("#logout").click();
    };
    $("#viewsite").onclick = function () { window.open("/", "_blank", "noopener"); };
    $("#logout").onclick = function () {
      if (!leaving()) return;
      api("logout", { method: "POST" }).then(function () {
        me = null; dirty = false;
        history.replaceState(null, "", location.pathname);   /* one render, not two */
        route();
      });
    };
    /* Keyboard users were dropped back to <body> on every navigation */
    var h = $("#main h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  function pageHead(crumb, title, lede, actionHtml) {
    return '<div class="phead"><div class="grow"><div class="crumbs">' + crumb + "</div>" +
      "<h1>" + esc(title) + "</h1>" + (lede ? '<p class="lede">' + esc(lede) + "</p>" : "") + "</div>" +
      (actionHtml || "") + "</div>";
  }

  function skeletons(n) {
    var s = "";
    for (var i = 0; i < (n || 4); i++) s += '<div class="sk"></div>';
    return '<div class="rows" aria-busy="true" aria-label="Loading">' + s + "</div>";
  }
  function errorState(msg, retry) {
    return '<div class="state error" role="alert"><h3>That did not load</h3><p>' + esc(msg) + "</p>" +
      (retry ? '<button class="btn" type="button" id="retrybtn">Try again</button>' : "") + "</div>";
  }

  /* ------------------------------------------------------------------ home */

  function renderHome() {
    shell(pageHead("Home", "Good day, " + me.name.replace(/^(Sr|Br|Bro|Fr|Mr|Mrs|Ms|Dr)\.?\s+/i, ""),
      "You are signed in as " + (me.role === "admin" ? "an administrator" : "an editor") + ". Choose what you would like to update.") +
      '<div id="homebody">' + skeletons(3) + "</div>", "home");

    var mine = navItems();
    /* An account with no sections used to land on a blank panel with nothing
       explaining why there was nothing to do. */
    if (!mine.length) {
      $("#homebody").innerHTML = '<div class="state empty"><h3>Nothing assigned to you yet</h3>' +
        "<p>Your account does not include any part of the website. Ask an administrator to give you access from the Users screen.</p></div>";
      return;
    }
    Promise.all(mine.map(function (i) {
      return api("content/" + (i.k === "gallery" ? "gallery" : i.k)).then(function (d) {
        if (i.k === "gallery") return { k: i.k, n: ((d.data && d.data.photos) || []).length, items: [] };
        return { k: i.k, n: (d.items || []).length, items: d.items || [] };
      }).catch(function () { return { k: i.k, n: null, items: [] }; });
    })).then(function (res) {
      res.forEach(function (r) { if (r.n != null) counts[r.k] = r.n; });

      var recent = [];
      res.forEach(function (r) {
        if (r.k === "gallery") return;
        r.items.forEach(function (it) { recent.push({ k: r.k, slug: it.slug, d: it.data || {} }); });
      });
      recent.sort(function (a, b) { return String(b.d.date || "").localeCompare(String(a.d.date || "")); });
      recent = recent.slice(0, 5);

      var tiles = mine.map(function (i) {
        var c = counts[i.k];
        var label = i.k === "gallery" ? "photos" : (c === 1 ? SECTIONS[i.k].single : SECTIONS[i.k].plural);
        return '<a class="tile" href="#/' + i.k + '"><span class="ico">' + icon(i.icon) + "</span>" +
          "<b>" + esc(i.label) + "</b><span>" + (c == null ? "—" : c + " " + label) + "</span></a>";
      }).join("");

      var recentHtml = recent.length
        ? '<div class="rows">' + recent.map(function (r) {
            var S = SECTIONS[r.k];
            return '<a class="row" href="#/' + r.k + "/" + encodeURIComponent(r.slug) + '">' +
              rowMedia(S, r.d) +
              '<div class="body"><div class="name">' + esc(r.d[S.idField] || r.slug) + "</div>" +
              '<div class="meta">' + esc(S.nav) + " · " + esc(S.meta(r.d)) + "</div></div></a>";
          }).join("") + "</div>"
        : '<div class="state empty"><h3>Nothing published yet</h3><p>Whatever you add will appear here.</p></div>';

      $("#homebody").innerHTML =
        '<div class="statusbar"><div class="grow">' +
          (lastPublish ? "<b>Last publish:</b> " + esc(lastPublish) + ". " : "") +
          "The website rebuilds about a minute after each publish.</div>" +
          '<a class="btn small" href="/" target="_blank" rel="noopener">View the live site</a></div>' +
        '<div class="tiles">' + tiles + "</div>" +
        "<h2 style=\"margin-bottom:16px\">Recently published</h2>" + recentHtml;
    });
  }

  function rowMedia(S, d) {
    var src = S.img ? S.img(d) : null;
    var mono = '<span class="mono" aria-hidden="true">' + esc(initials(d[S.idField])) + "</span>";
    if (!src) return mono;
    /* Older stories point at images that have since been removed, and a
       YouTube thumbnail may not load at all. Falling back to the initials
       keeps the row readable instead of showing a broken-image icon. */
    return '<img class="thumb' + (S.person ? " person" : "") + '" src="' + esc(src) + '" alt="" loading="lazy" ' +
      'data-fallback="' + esc(initials(d[S.idField])) + '" onerror="var s=document.createElement(\'span\');s.className=\'mono\';s.setAttribute(\'aria-hidden\',\'true\');s.textContent=this.dataset.fallback;this.replaceWith(s)">';
  }

  /* ------------------------------------------------------------------ list */

  function renderList(type) {
    var S = SECTIONS[type];
    shell(pageHead('<a href="#/">Home</a> · Content', S.label, S.blurb,
      '<button class="btn primary" id="newbtn">+ New ' + esc(S.single) + "</button>") +
      '<div id="listbody">' + skeletons() + "</div>", type);

    $("#newbtn").onclick = function () { go("#/" + type + "/new"); };

    var all = [];
    var facetValue = "";
    var query = "";

    function paint() {
      var items = all.filter(function (it) {
        if (facetValue && String(it.data[S.facet.field] || "") !== facetValue) return false;
        if (!query) return true;
        var hay = (String(it.data[S.idField] || "") + " " + S.meta(it.data)).toLowerCase();
        return hay.indexOf(query.toLowerCase()) >= 0;
      });

      var justSlug = (/[?&]just=([^&]+)/.exec(location.hash) || [])[1];
      var body = items.length
        ? '<div class="rows">' + items.map(function (it) {
            var d = it.data;
            var isNew = justSlug && decodeURIComponent(justSlug) === it.slug;
            return '<a class="row' + (isNew ? " is-new" : "") + '" href="#/' + type + "/" + encodeURIComponent(it.slug) + '">' +
              rowMedia(S, d) +
              '<div class="body"><div class="name">' + esc(d[S.idField] || it.slug) + "</div>" +
              '<div class="meta">' + esc(S.meta(d)) + "</div></div>" +
              '<div class="badges">' + (isNew ? '<span class="badge ok">Just published</span>' : "") +
              (d.featured ? '<span class="badge featured">Featured</span>' : "") + "</div></a>";
          }).join("") + "</div>"
        : (all.length
            ? '<div class="state empty"><h3>Nothing matches</h3><p>No ' + esc(S.plural) + " match what you typed. Clear the search to see them all.</p></div>"
            : '<div class="state empty"><h3>No ' + esc(S.plural) + ' yet</h3><p>' + esc(S.blurb) + '</p><button class="btn primary" type="button" id="firstbtn">Add the first ' + esc(S.single) + "</button></div>");

      $("#rowsHolder").innerHTML = body;
      var fb = $("#firstbtn");
      if (fb) fb.onclick = function () { go("#/" + type + "/new"); };
      $("#countline").textContent = items.length === all.length
        ? all.length + " " + (all.length === 1 ? S.single : S.plural)
        : items.length + " of " + all.length + " " + S.plural;
    }

    api("content/" + type).then(function (d) {
      all = (d.items || []).slice();
      all.sort(function (a, b) {
        if (type === "team") return (a.data.order == null ? 50 : a.data.order) - (b.data.order == null ? 50 : b.data.order) || String(a.data.name || "").localeCompare(String(b.data.name || ""));
        return String(b.data.date || "").localeCompare(String(a.data.date || ""));
      });
      counts[type] = all.length;

      var facets = [];
      all.forEach(function (it) {
        var v = String(it.data[S.facet.field] || "");
        if (v && facets.indexOf(v) < 0) facets.push(v);
      });
      facets.sort();

      /* Search and filters only earn their space once a list is long enough
         to make scanning it tiresome. */
      var showTools = all.length > 8;
      $("#listbody").innerHTML =
        (showTools
          ? '<div class="toolbar">' +
              '<div class="search"><label class="vh" for="q">Search ' + esc(S.plural) + '</label>' +
              icon(ICON_SEARCH) + '<input id="q" type="search" placeholder="Search ' + esc(S.plural) + '…"></div>' +
              (facets.length > 1 ? '<div class="chipbar" role="group" aria-label="' + esc(S.facet.label) + '">' +
                '<button type="button" class="on" data-facet="">All</button>' +
                facets.map(function (f) { return '<button type="button" data-facet="' + esc(f) + '">' + esc(f) + "</button>"; }).join("") +
                "</div>" : "") +
            "</div>"
          : "") +
        '<div class="countline" id="countline"></div><div id="rowsHolder"></div>';

      if (showTools) {
        var q = $("#q");
        if (q) q.oninput = function () { query = q.value.trim(); paint(); };
        Array.prototype.forEach.call(document.querySelectorAll("[data-facet]"), function (b) {
          b.onclick = function () {
            facetValue = b.getAttribute("data-facet");
            Array.prototype.forEach.call(document.querySelectorAll("[data-facet]"), function (x) { x.className = x === b ? "on" : ""; });
            paint();
          };
        });
      }
      paint();
    }).catch(function (err) {
      $("#listbody").innerHTML = errorState(err.message, true);
      var r = $("#retrybtn"); if (r) r.onclick = function () { renderList(type); };
    });
  }

  /* ---------------------------------------------------------------- fields */

  function fieldHtml(f, v) {
    var id = "f-" + f.n, hid = "h-" + f.n;
    var lbl = '<span class="lbl">' + esc(f.l) + (f.req ? '<span class="req" aria-hidden="true">*</span>' : "") + "</span>";
    var describe = f.hint ? ' aria-describedby="' + hid + '"' : "";
    var hint = f.hint ? '<div class="hint" id="' + hid + '">' + esc(f.hint) + "</div>" : "";
    var body;

    if (f.w === "select") {
      var opts = (f.opts || []).map(function (o) {
        var val = Array.isArray(o) ? o[0] : o, lab = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(val) + '"' + (String(v == null ? "" : v) === String(val) ? " selected" : "") + ">" + esc(lab || "—") + "</option>";
      }).join("");
      /* A required select with no blank option can never fail validation, so
         users published the first item in the list without choosing. */
      var hasBlank = (f.opts || []).some(function (o) { return (Array.isArray(o) ? o[0] : o) === ""; });
      if (f.req && !hasBlank) opts = '<option value="" disabled' + (v ? "" : " selected") + ">Choose…</option>" + opts;
      /* Keep a value the panel does not know about rather than silently
         rewriting it to the first option on save. */
      if (v && !(f.opts || []).some(function (o) { return String(Array.isArray(o) ? o[0] : o) === String(v); })) {
        opts = '<option value="' + esc(v) + '" selected>' + esc(v) + "</option>" + opts;
      }
      body = '<select class="in" id="' + id + '" data-f="' + f.n + '"' + describe + ">" + opts + "</select>";
    } else if (f.w === "multi") {
      var cur = Array.isArray(v) ? v : [];
      var known = (f.opts || []).slice();
      cur.forEach(function (c) { if (known.indexOf(c) < 0) known.push(c); });
      return '<fieldset class="f' + (f.span ? " span2" : "") + '"><legend class="lbl">' + esc(f.l) + "</legend>" +
        '<div class="chips" data-multi="' + f.n + '" data-max="' + (f.max || 99) + '">' +
        known.map(function (o, i) {
          return '<label><input type="checkbox" value="' + esc(o) + '"' + (cur.indexOf(o) >= 0 ? " checked" : "") + ">" + esc(o) + "</label>";
        }).join("") + "</div>" + hint + "</fieldset>";
    } else if (f.w === "bool") {
      return '<label class="f' + (f.span ? " span2" : "") + '" style="display:flex;gap:10px;align-items:center">' +
        '<input type="checkbox" id="' + id + '" data-f="' + f.n + '"' + (v ? " checked" : "") + ' style="width:20px;height:20px;accent-color:var(--s-accent-dark)">' +
        '<span class="lbl" style="margin:0">' + esc(f.l) + "</span></label>";
    } else if (f.w === "image" || f.w === "file") {
      var isPdf = f.w === "file";
      return '<div class="f' + (f.span ? " span2" : "") + '">' + lbl +
        '<div class="imgpick" data-pick="' + f.n + '">' +
        (v && !isPdf ? '<img src="' + esc(v) + '" alt="Currently selected">'
                     : '<span class="ph">' + (v ? (isPdf ? "PDF attached" : "Selected") : (isPdf ? "No file" : "No image")) + "</span>") +
        '<input type="hidden" data-f="' + f.n + '" value="' + esc(v || "") + '">' +
        '<input type="file" class="vh" accept="' + (isPdf ? ".pdf" : "image/*") + '">' +
        '<button type="button" class="btn small pickbtn">' + (v ? "Replace…" : "Choose…") + "</button>" +
        (v ? '<button type="button" class="btn small danger clearbtn">Remove</button>' : "") +
        "</div>" + hint + "</div>";
    } else if (f.w === "text") {
      body = '<textarea class="in" id="' + id + '" data-f="' + f.n + '"' + describe + ' rows="3"></textarea>';
    } else if (f.w === "markdown") {
      body = '<textarea class="in tall" id="' + id + '" data-f="' + f.n + '"' + describe + "></textarea>";
    } else if (f.w === "tags") {
      body = '<input class="in" id="' + id + '" data-f="' + f.n + '" data-tags="1"' + describe + ' value="' + esc(Array.isArray(v) ? v.join(", ") : (v || "")) + '">';
    } else if (f.w === "number") {
      body = '<input class="in" id="' + id + '" data-f="' + f.n + '" type="number"' + describe + ' value="' + esc(v == null ? "" : v) + '">';
    } else if (f.w === "date") {
      body = '<input class="in" id="' + id + '" data-f="' + f.n + '" type="date"' + describe + ' value="' + esc(v || "") + '">';
    } else {
      body = '<input class="in" id="' + id + '" data-f="' + f.n + '"' + describe + ' value="' + esc(v == null ? "" : v) + '">';
    }
    return '<label class="f' + (f.span ? " span2" : "") + '" for="' + id + '">' + lbl + body + hint + "</label>";
  }

  function wireUploads(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll("[data-pick]"), function (p) {
      var fileIn = p.querySelector('input[type="file"]');
      var pick = p.querySelector(".pickbtn");
      pick.onclick = function () { fileIn.click(); };
      var clear = p.querySelector(".clearbtn");
      if (clear) clear.onclick = function () {
        p.querySelector("[data-f]").value = "";
        var img = p.querySelector("img");
        /* Removing a PDF used to leave the box still reading "PDF", so the
           user got "required" on submit with no idea why. */
        if (img) { var ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "No image"; img.replaceWith(ph); }
        else { var e = p.querySelector(".ph"); if (e) e.textContent = "No file"; }
        pick.textContent = "Choose…";
        clear.remove();
        dirty = true;
        toast("Removed — publish to make it permanent", true);
      };
      fileIn.onchange = function () {
        var file = fileIn.files[0];
        /* Always release the input, whatever happens below. A file input that
           still holds the last selection fires no change event when the same
           file is picked again, so a rejected or retried upload looks dead. */
        var release = function () { fileIn.value = ""; };
        if (!file) { release(); return; }
        if (file.size > 4.2 * 1024 * 1024) { toast("That file is bigger than 4 MB — please shrink it first"); release(); return; }
        var btn = pick; btn.disabled = true; btn.textContent = "Uploading…";
        /* Publishing mid-upload used to save the item with an empty path */
        var form = p.closest("form");
        var submit = form && form.querySelector("button[type=submit]");
        if (submit) submit.disabled = true;
        var done = function (label) {
          btn.textContent = label; btn.disabled = false;
          if (submit) submit.disabled = false;
          release();
        };
        var rd = new FileReader();
        rd.onerror = function () { done("Choose…"); toast("That file could not be read — try choosing it again"); };
        rd.onload = function () {
          api("upload", { method: "POST", body: { name: file.name, data: String(rd.result).split(",")[1] } })
            .then(function (d) {
              p.querySelector("[data-f]").value = d.path;
              var img = p.querySelector("img"), ph = p.querySelector(".ph");
              if (/\.pdf$/i.test(d.path)) { if (ph) ph.textContent = "PDF attached"; }
              else if (img) img.src = d.path;
              else { if (ph) ph.remove(); p.insertAdjacentHTML("afterbegin", '<img src="' + d.path + '" alt="Currently selected">'); }
              if (!p.querySelector(".clearbtn")) {
                var c = document.createElement("button");
                c.type = "button"; c.className = "btn small danger clearbtn"; c.textContent = "Remove";
                p.appendChild(c);
                c.onclick = clear ? clear.onclick : function () { p.querySelector("[data-f]").value = ""; c.remove(); };
              }
              dirty = true;
              done("Replace…");
              toast("Uploaded", true);
            })
            .catch(function (e) { done("Choose…"); toast(e.message); });
        };
        rd.readAsDataURL(file);
      };
    });
  }

  /* ---------------------------------------------------------------- editor */

  function renderEdit(type, slug) {
    var S = SECTIONS[type];
    var isNew = !slug;

    function draw(data) {
      var groups = S.groups || [{ legend: S.label, fields: S.fields.map(function (f) { return f.n; }) }];
      var byName = {};
      S.fields.forEach(function (f) { byName[f.n] = f; });

      var body = groups.map(function (g) {
        return '<fieldset class="fs"><legend>' + esc(g.legend) + "</legend><div class=\"grid2\">" +
          g.fields.map(function (n) { return byName[n] ? fieldHtml(byName[n], data[n]) : ""; }).join("") +
          "</div></fieldset>";
      }).join("");

      shell(pageHead('<a href="#/' + type + '">' + esc(S.label) + "</a> · " + (isNew ? "New" : "Editing"),
        isNew ? "New " + S.single : (data[S.idField] || "Edit"),
        isNew ? null : "Changes go live on the website about a minute after you publish.") +
        '<form class="panel" id="ef" novalidate><div class="err" id="eerr" role="alert"></div>' + body +
        '<div class="bar"><button class="btn primary" type="submit">Publish</button>' +
        '<button class="btn" type="button" id="backbtn">Cancel</button><span class="grow"></span>' +
        (isNew ? "" : '<button class="btn danger" type="button" id="delbtn">Delete</button>') +
        "</div></form>", type);

      var form = $("#ef");
      /* Values that HTML attributes cannot carry safely */
      S.fields.forEach(function (f) {
        var el = form.querySelector('[data-f="' + f.n + '"]');
        if (!el) return;
        if (f.w === "text" || f.w === "markdown") el.value = data[f.n] == null ? "" : data[f.n];
      });
      wireUploads(form);
      form.addEventListener("input", function () { dirty = true; });
      form.addEventListener("change", function () { dirty = true; });

      $("#backbtn").onclick = function () { if (leaving()) go("#/" + type); };
      var del = $("#delbtn");
      if (del) del.onclick = function () {
        if (!confirm("Delete “" + (data[S.idField] || slug) + "”? This cannot be undone.")) return;
        api("content/" + type + "/" + encodeURIComponent(slug), { method: "DELETE" })
          .then(function () { dirty = false; toast("Deleted — the site is rebuilding", true); go("#/" + type); })
          .catch(function (e) { toast(e.message); });
      };

      form.onsubmit = function (e) {
        e.preventDefault();
        var out = {};
        var problems = [];
        var firstBad = null;
        S.fields.forEach(function (f) {
          var el = form.querySelector('[data-f="' + f.n + '"]');
          var multi = form.querySelector('[data-multi="' + f.n + '"]');
          var v;
          if (multi) {
            v = Array.prototype.slice.call(multi.querySelectorAll("input:checked")).map(function (i) { return i.value; });
            if (v.length > Number(multi.getAttribute("data-max"))) problems.push("Pick at most " + multi.getAttribute("data-max") + " " + f.l.toLowerCase());
          }
          else if (el && el.type === "checkbox") v = el.checked;
          else if (el && el.getAttribute("data-tags")) v = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          else if (el && el.type === "number") {
            /* Blank used to become 0, so a publication with no page count was
               stored as "0 pages". */
            if (el.value === "") { if (f.def != null) v = f.def; else { return; } }
            else v = Number(el.value);
          }
          else v = el ? el.value.trim() : "";
          if (f.req && (v === "" || (Array.isArray(v) && !v.length))) {
            problems.push(f.l + " is needed");
            if (el) { el.setAttribute("aria-invalid", "true"); if (!firstBad) firstBad = el; }
          } else if (el) el.removeAttribute("aria-invalid");
          out[f.n] = v;
        });

        var er = $("#eerr");
        if (problems.length) {
          /* Report everything at once — reporting only the first meant fixing
             one problem and discovering the next on the next attempt. */
          er.textContent = problems.length === 1 ? problems[0] : "Please check: " + problems.join("; ");
          er.className = "err show";
          if (firstBad) firstBad.focus();
          return;
        }
        er.className = "err";

        var target = slug || slugify(out[S.idField]);
        var btn = form.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "Publishing…";
        api("content/" + type + "/" + encodeURIComponent(target), { method: "PUT", body: { data: out, create: !slug } })
          .then(function () {
            dirty = false;
            lastPublish = "just now";
            toast("Published", true);
            /* The old panel jumped straight back to the list and left a toast
               that vanished in 3.6 seconds. If you missed it there was no
               evidence at all that the publish had happened. */
            $("#main").innerHTML =
              '<div class="done" role="status"><h3>Published</h3>' +
              "<p>“" + esc(out[S.idField]) + "” will be live on the website in about a minute.</p>" +
              '<div class="btns">' +
              (type === "news" ? '<a class="btn primary" href="/news/' + encodeURIComponent(target) + '/" target="_blank" rel="noopener">View it on the website</a>' : '<a class="btn primary" href="/" target="_blank" rel="noopener">View the website</a>') +
              '<button class="btn" type="button" id="donelist">Back to ' + esc(S.label) + "</button>" +
              '<button class="btn" type="button" id="doneedit">Keep editing</button></div></div>';
            $("#donelist").onclick = function () { go("#/" + type + "?just=" + encodeURIComponent(target)); };
            $("#doneedit").onclick = function () { go("#/" + type + "/" + encodeURIComponent(target)); route(); };
          })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = "Publish";
            er.textContent = err.message; er.className = "err show";
            er.scrollIntoView({ block: "center", behavior: "smooth" });
          });
      };
    }

    if (isNew) { var seed = {}; S.fields.forEach(function (f) { if (f.def != null) seed[f.n] = f.def; }); draw(seed); return; }
    /* Show the frame immediately: opening a story used to leave the previous
       screen sitting there with no sign anything was happening. */
    shell(pageHead('<a href="#/' + type + '">' + esc(S.label) + "</a> · Editing", "Opening…", null) + skeletons(2), type);
    api("content/" + type + "/" + encodeURIComponent(slug))
      .then(function (d) { draw(d.data || {}); })
      .catch(function (err) {
        shell(pageHead('<a href="#/' + type + '">' + esc(S.label) + "</a>", "Could not open this", null) + errorState(err.message, true), type);
        var r = $("#retrybtn"); if (r) r.onclick = function () { renderEdit(type, slug); };
      });
  }

  /* --------------------------------------------------------------- gallery */

  function renderGallery() {
    shell(pageHead('<a href="#/">Home</a> · Content', "Photo gallery",
      "Photographs shown on the Gallery page. The newest also appear on the homepage.",
      '<button class="btn" id="addph">+ Add photos</button>' +
      '<input type="file" id="galfile" class="vh" accept="image/*" multiple>') +
      '<div class="countline" id="galcount"></div><div id="gal">' + skeletons(2) + "</div>" +
      '<div class="bar" style="position:static;margin-top:24px;border-radius:14px;border:1px solid var(--s-line)">' +
      '<button class="btn primary" id="savegal">Publish gallery</button>' +
      '<span class="hint" style="margin:0">Adding, reordering and captioning only take effect once you publish.</span></div>', "gallery");

    var photos = [];
    var g = $("#gal");

    function draw(focusIndex) {
      $("#galcount").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
      if (!photos.length) {
        g.innerHTML = '<div class="state empty"><h3>No photos yet</h3><p>Add photographs from events, trainings and outreach.</p></div>';
        return;
      }
      g.innerHTML = photos.map(function (p, i) {
        return '<div class="gitem"><img src="' + esc(p.image) + '" alt="" loading="lazy">' +
          '<div class="gbody"><div class="pos">Photo ' + (i + 1) + " of " + photos.length + "</div>" +
          '<label class="vh" for="cap' + i + '">Caption for photo ' + (i + 1) + "</label>" +
          '<input class="in" id="cap' + i + '" data-cap="' + i + '" value="' + esc(p.caption || "") + '" placeholder="Caption">' +
          '<div class="hint">Also read aloud to blind visitors.</div>' +
          '<div class="gops">' +
          '<button type="button" data-mv="' + i + '" data-dir="-1" aria-label="Move photo ' + (i + 1) + ' earlier"' + (i === 0 ? " disabled" : "") + ">←</button>" +
          '<button type="button" data-mv="' + i + '" data-dir="1" aria-label="Move photo ' + (i + 1) + ' later"' + (i === photos.length - 1 ? " disabled" : "") + ">→</button>" +
          '<button type="button" class="rm" data-rm="' + i + '" aria-label="Remove photo ' + (i + 1) + '">Remove</button>' +
          "</div></div></div>";
      }).join("");

      g.querySelectorAll("[data-cap]").forEach(function (inp) {
        inp.oninput = function () { photos[Number(inp.getAttribute("data-cap"))].caption = inp.value; dirty = true; };
      });
      g.querySelectorAll("[data-mv]").forEach(function (b) {
        b.onclick = function () {
          var i = Number(b.getAttribute("data-mv")), j = i + Number(b.getAttribute("data-dir"));
          if (j < 0 || j >= photos.length) return;
          var t = photos[i]; photos[i] = photos[j]; photos[j] = t;
          dirty = true;
          draw(j);            /* keep focus with the photo that moved */
        };
      });
      g.querySelectorAll("[data-rm]").forEach(function (b) {
        b.onclick = function () {
          var i = Number(b.getAttribute("data-rm"));
          /* Deleting a story asks first; removing a photo used not to. */
          if (!confirm("Remove photo " + (i + 1) + " from the gallery?")) return;
          photos.splice(i, 1); dirty = true; draw(Math.min(i, photos.length - 1));
        };
      });
      if (focusIndex != null && photos.length) {
        var f = g.querySelector('[data-mv="' + focusIndex + '"]');
        if (f && !f.disabled) f.focus();
      }
    }

    api("content/gallery").then(function (d) { photos = (d.data && d.data.photos) || []; counts.gallery = photos.length; draw(); })
      /* Without this the panel sat on "Loading…" for ever when the call failed */
      .catch(function (err) {
        g.innerHTML = errorState(err.message, true);
        var r = $("#retrybtn"); if (r) r.onclick = renderGallery;
      });

    $("#addph").onclick = function () { $("#galfile").click(); };
    $("#galfile").onchange = function () {
      var files = Array.prototype.slice.call($("#galfile").files);
      var release = function () { $("#galfile").value = ""; };
      if (!files.length) { release(); return; }
      var addBtn = $("#addph"), saveBtn = $("#savegal");
      addBtn.disabled = true; saveBtn.disabled = true;
      var n = 0;
      var step = function () {
        addBtn.textContent = "Uploading " + (n + 1) + " of " + files.length + "…";
      };
      step();
      files.reduce(function (chain, file) {
        return chain.then(function () {
          if (file.size > 4.2 * 1024 * 1024) { toast(file.name + " is bigger than 4 MB and was skipped"); n++; step(); return; }
          return new Promise(function (res) {
            var rd = new FileReader();
            rd.onerror = function () { toast(file.name + " could not be read"); n++; step(); res(); };
            rd.onload = function () {
              api("upload", { method: "POST", body: { name: file.name, data: String(rd.result).split(",")[1] } })
                .then(function (d) { photos.push({ image: d.path, caption: "" }); dirty = true; })
                .catch(function (e) { toast(e.message); })
                .then(function () { n++; step(); res(); });
            };
            rd.readAsDataURL(file);
          });
        });
      }, Promise.resolve()).then(function () {
        addBtn.disabled = false; addBtn.textContent = "+ Add photos";
        saveBtn.disabled = false;
        release();
        draw();
        toast(n + " added — press Publish gallery to put them on the website", true);
      });
    };

    $("#savegal").onclick = function () {
      var b = $("#savegal"); b.disabled = true; b.textContent = "Publishing…";
      api("content/gallery/gallery", { method: "PUT", body: { data: { photos: photos } } })
        .then(function () { dirty = false; counts.gallery = photos.length; toast("Gallery published — live in about a minute", true); })
        .catch(function (e) { toast(e.message); })
        .then(function () { b.disabled = false; b.textContent = "Publish gallery"; });
    };
  }

  /* ----------------------------------------------------------------- users */

  function renderUsers() {
    shell(pageHead('<a href="#/">Home</a> · Settings', "Users",
      "Who can sign in, and which parts of the website they may change.",
      '<button class="btn primary" id="adduser">+ Add user</button>') +
      '<div id="ulist">' + skeletons(3) + "</div><div id=\"uform\"></div>", "users");

    var listEl = $("#ulist");
    function load() {
      api("users").then(function (d) {
        counts.users = d.users.length;
        listEl.innerHTML = '<div class="rows">' + d.users.map(function (u) {
          return '<a class="row" href="#/users" data-u="' + esc(u.email) + '">' +
            '<span class="mono">' + esc(initials(u.name)) + "</span>" +
            '<div class="body"><div class="name">' + esc(u.name) + "</div>" +
            '<div class="meta">' + esc(u.email) + "</div>" +
            '<div class="meta">' + esc(u.role === "admin" ? "Everything, and manages users" : (u.sections.map(function (s) { return SEC_LABELS[s]; }).join(", ") || "No sections yet")) + "</div></div>" +
            '<div class="badges"><span class="badge ' + u.role + '">' + esc(u.role) + "</span></div></a>";
        }).join("") + "</div>";
        listEl.querySelectorAll("[data-u]").forEach(function (r) {
          r.onclick = function (e) {
            e.preventDefault();
            form(d.users.filter(function (x) { return x.email === r.getAttribute("data-u"); })[0]);
          };
        });
      })
        /* Same trap as the gallery: a failure left "Loading…" on screen for ever */
        .catch(function (err) {
          listEl.innerHTML = errorState(err.message, true);
          var rb = $("#retrybtn"); if (rb) rb.onclick = load;
        });
    }

    function form(u) {
      var isNew = !u;
      var secs = ["news", "publications", "videos", "team", "gallery"];
      $("#uform").innerHTML = '<form class="panel" style="margin-top:24px" id="uf">' +
        "<h3 style=\"margin-bottom:16px\">" + (isNew ? "Add a user" : "Edit " + esc(u.name)) + '</h3><div class="err" id="uerr" role="alert"></div>' +
        '<div class="grid2">' +
        '<label class="f" for="u-name"><span class="lbl">Full name</span><input class="in" id="u-name" name="name" required value="' + esc(isNew ? "" : u.name) + '"></label>' +
        '<label class="f" for="u-email"><span class="lbl">Email</span><input class="in" id="u-email" name="email" type="email" required value="' + esc(isNew ? "" : u.email) + '"' + (isNew ? "" : " readonly") + "></label>" +
        '<label class="f" for="u-pass"><span class="lbl">' + (isNew ? "Password" : "New password") + '</span><input class="in" id="u-pass" name="password" type="password" minlength="8"' + (isNew ? " required" : "") + '><div class="hint">' + (isNew ? "At least 8 characters — share it with them." : "Leave blank to keep their current password.") + "</div></label>" +
        '<label class="f" for="u-role"><span class="lbl">Role</span><select class="in" id="u-role" name="role"><option value="editor"' + (!isNew && u.role === "editor" ? " selected" : "") + '>Editor</option><option value="admin"' + (!isNew && u.role === "admin" ? " selected" : "") + ">Administrator</option></select></label>" +
        '<fieldset class="f span2" id="secwrap"><legend class="lbl">Sections they may change</legend>' +
        /* A new user starts with everything ticked: an account created with no
           sections can sign in and do nothing, with no explanation on screen. */
        '<div class="chips" id="usecs">' + secs.map(function (s) {
          return '<label><input type="checkbox" value="' + s + '"' + (isNew || u.sections.indexOf(s) >= 0 ? " checked" : "") + ">" + esc(SEC_LABELS[s]) + "</label>";
        }).join("") + '</div><div class="hint" id="sechint"></div></fieldset>' +
        '</div><div class="bar" style="position:static;margin:16px 0 0;padding:16px 0 0;border-radius:0">' +
        '<button class="btn primary" type="submit">' + (isNew ? "Create user" : "Save changes") + "</button>" +
        '<button class="btn" type="button" id="ucancel">Cancel</button><span class="grow"></span>' +
        (isNew || u.email === me.email ? "" : '<button class="btn danger" type="button" id="udel">Remove user</button>') +
        "</div></form>";

      /* Administrators always have every section; ticking boxes for them did
         nothing and said nothing. */
      var roleSel = $("#u-role"), wrap = $("#secwrap"), hint = $("#sechint");
      function syncRole() {
        var admin = roleSel.value === "admin";
        wrap.querySelectorAll("input").forEach(function (i) { i.disabled = admin; });
        wrap.style.opacity = admin ? ".55" : "";
        hint.textContent = admin ? "Administrators can change everything, so these cannot be limited." : "";
      }
      roleSel.onchange = syncRole; syncRole();

      $("#ucancel").onclick = function () { $("#uform").innerHTML = ""; };
      var ud = $("#udel");
      if (ud) ud.onclick = function () {
        if (!confirm("Remove " + u.name + "? They will no longer be able to sign in.")) return;
        api("users/" + encodeURIComponent(u.email), { method: "DELETE" })
          .then(function () { $("#uform").innerHTML = ""; load(); toast("User removed", true); })
          .catch(function (e) { toast(e.message); });
      };

      $("#uf").onsubmit = function (e) {
        e.preventDefault();
        var f = e.target;
        var sections = Array.prototype.slice.call($("#usecs").querySelectorAll("input:checked")).map(function (i) { return i.value; });
        $("#uerr").className = "err";                       /* clear any earlier failure */
        var ub = f.querySelector("button[type=submit]");
        ub.disabled = true;                                 /* a second click resent a now-stale password */
        api("users", { method: "POST", body: { name: f.name.value, email: f.email.value, password: f.password.value || undefined, role: f.role.value, sections: sections, update: !isNew } })
          .then(function () { $("#uform").innerHTML = ""; load(); toast(isNew ? "User created — share their email and password with them" : "Saved", true); })
          .catch(function (err) { ub.disabled = false; var el = $("#uerr"); el.textContent = err.message; el.className = "err show"; });
      };
      $("#uform").scrollIntoView({ behavior: "smooth", block: "nearest" });
      $("#u-name").focus();
    }

    $("#adduser").onclick = function () { form(null); };
    load();
  }

  /* --------------------------------------------------------------- account */

  function renderAccount() {
    shell(pageHead('<a href="#/">Home</a> · Settings', "My account",
      "You are signed in as " + me.email + ".") +
      '<form class="panel" id="pf" style="max-width:520px" novalidate><h3 style="margin-bottom:16px">Change your password</h3>' +
      '<div class="err" id="perr" role="alert"></div>' +
      '<label class="f" for="p-old" style="margin-bottom:16px"><span class="lbl">Current password</span><input class="in" id="p-old" name="old" type="password" required autocomplete="current-password"></label>' +
      '<label class="f" for="p-new" style="margin-bottom:16px"><span class="lbl">New password</span><input class="in" id="p-new" name="pw" type="password" required minlength="8" autocomplete="new-password"></label>' +
      '<label class="f" for="p-new2" style="margin-bottom:16px"><span class="lbl">New password again</span><input class="in" id="p-new2" name="pw2" type="password" required minlength="8" autocomplete="new-password"><div class="hint">Typing it twice guards against a typo locking you out.</div></label>' +
      '<button class="btn primary" type="submit">Change password</button></form>', "account");

    $("#pf").onsubmit = function (e) {
      e.preventDefault();
      var f = e.target, er = $("#perr");
      er.className = "err";                                  /* stale errors used to linger after success */
      if (f.pw.value !== f.pw2.value) { er.textContent = "The two new passwords do not match"; er.className = "err show"; f.pw2.focus(); return; }
      if (f.pw.value.length < 8) { er.textContent = "The new password needs at least 8 characters"; er.className = "err show"; f.pw.focus(); return; }
      var b = f.querySelector("button"); b.disabled = true;
      api("password", { method: "POST", body: { current: f.old.value, next: f.pw.value } })
        .then(function () { f.reset(); toast("Password changed", true); })
        .catch(function (err) { er.textContent = err.message; er.className = "err show"; })
        .then(function () { b.disabled = false; });
    };
  }

  /* ----------------------------------------------------------------- route */

  function route() {
    if (!me) return renderAuth();
    var raw = (location.hash || "#/").replace(/^#\/?/, "");
    var parts = raw.split("?")[0].split("/").filter(Boolean);

    if (!parts.length) return renderHome();
    var head = parts[0];

    if (head === "users") { if (me.role !== "admin") return renderHome(); return renderUsers(); }
    if (head === "account") return renderAccount();
    if (head === "gallery") { if (me.sections.indexOf("gallery") < 0) return denied(); return renderGallery(); }
    if (SECTIONS[head]) {
      if (me.sections.indexOf(head) < 0) return denied();
      if (parts[1] === "new") return renderEdit(head, null);
      if (parts[1]) return renderEdit(head, decodeURIComponent(parts[1]));
      return renderList(head);
    }
    return renderHome();
  }

  function denied() {
    shell(pageHead('<a href="#/">Home</a>', "Not available to you",
      "Your account does not include this section. An administrator can change that from the Users screen.") +
      '<a class="btn primary" href="#/">Back to home</a>', null);
  }

  window.addEventListener("hashchange", route);

  /* status answers both questions in one call — whether an account exists at
     all, and whether this browser still has a valid session. */
  api("status")
    .then(function (s) { if (s.user) { me = s.user; route(); } else renderAuth(); })
    .catch(function () { renderAuth(); });
})();
</script>
</body>
</html>
