<style>
/* ==========================================================================
   Talitha Kum RAHT Kenya — Publications repository
   Design system + components. Everything is scoped under .tkpub so it cannot
   leak into the Elementor theme, and the theme cannot easily leak in.

   To rebrand, change the custom properties in the :root-scoped block below.
   Nothing else in this file hard-codes a colour.
   ========================================================================== */

.tkpub {
  /* --- Brand -------------------------------------------------------------
     Taken from the live BigHearts theme settings so this page matches the
     rest of talithakumraht.org. If the theme colours are ever changed in
     Elementor, change these eight values and everything follows.
     ---------------------------------------------------------------------- */
  --tk-accent: #F74F22;        /* theme primary  — buttons, active states */
  --tk-accent-dark: #d93d13;   /* hover/pressed */
  --tk-accent-soft: #fdeae3;   /* tinted backgrounds */
  --tk-gold: #FFAC00;          /* theme secondary — highlights, featured */
  --tk-gold-soft: #fff4dc;
  --tk-deep: #232323;          /* theme heading colour */
  --tk-alert: #d0342c;         /* destructive only */

  /* --- Neutrals --------------------------------------------------------- */
  --tk-ink: #232323;
  --tk-body: #616161;          /* theme content colour */
  --tk-muted: #8c8c8c;
  --tk-line: #e7e4e1;
  --tk-line-soft: #f4f1ee;
  --tk-surface: #ffffff;
  --tk-canvas: #faf8f6;

  /* --- Scale ------------------------------------------------------------ */
  --tk-radius: 10px;           /* BigHearts card radius */
  --tk-radius-sm: 8px;
  --tk-radius-pill: 28px;      /* BigHearts button radius */
  --tk-gap: 22px;
  --tk-shadow: 11px 10px 38px 0 rgba(0, 0, 0, .1);   /* the theme's card shadow */
  --tk-shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .35);

  /* --- Type -------------------------------------------------------------
     The theme already loads Nunito Sans, Quicksand and Amatic SC, so these
     cost nothing extra. The stacks fall back gracefully if it ever stops.
     ---------------------------------------------------------------------- */
  --tk-font: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --tk-head-font: "Quicksand", "Nunito Sans", -apple-system, "Segoe UI", sans-serif;

  font-family: var(--tk-font);
  color: var(--tk-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* Headings follow the theme: Quicksand 700, #232323. */
.tkpub h1, .tkpub h2, .tkpub h3, .tkpub h4,
.tkpub .tkpub-title, .tkpub .tkpub-card h3 {
  font-family: var(--tk-head-font);
  font-weight: 700;
  color: var(--tk-deep);
}

/* Reset only inside our scope — Elementor themes vary wildly. */
.tkpub *,
.tkpub *::before,
.tkpub *::after { box-sizing: border-box; }

.tkpub h1, .tkpub h2, .tkpub h3, .tkpub h4, .tkpub p,
.tkpub ul, .tkpub ol, .tkpub figure { margin: 0; padding: 0; }
.tkpub ul, .tkpub ol { list-style: none; }
.tkpub img { max-width: 100%; display: block; }
.tkpub button { font: inherit; color: inherit; cursor: pointer; }

.tkpub :focus-visible {
  outline: 3px solid var(--tk-gold);
  outline-offset: 2px;
  border-radius: 4px;
}

.tkpub-sr {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ==========================================================================
   Header
   ========================================================================== */

.tkpub-head { margin-bottom: 26px; }

.tkpub-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tk-accent);
  background: var(--tk-accent-soft);
  padding: 6px 12px;
  border-radius: var(--tk-radius-pill);
  margin-bottom: 14px;
}

.tkpub-title {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.15;
  font-weight: 800;
  color: var(--tk-deep);
  letter-spacing: -.02em;
}

.tkpub-lede {
  margin-top: 10px;
  max-width: 62ch;
  font-size: 17px;
  color: var(--tk-body);
}

/* ==========================================================================
   Toolbar — search, facets, sort, view switch
   ========================================================================== */

.tkpub-toolbar {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 16px;
  box-shadow: var(--tk-shadow);
  margin-bottom: 22px;
  position: sticky;
  top: 0;
  z-index: 20;
}
/* Themes with a fixed header can set --tk-sticky-offset on .tkpub */
.tkpub[style*="--tk-sticky-offset"] .tkpub-toolbar { top: var(--tk-sticky-offset); }

.tkpub-toolbar-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.tkpub-search {
  position: relative;
  flex: 1 1 260px;
  min-width: 0;
}
.tkpub-search svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--tk-muted); pointer-events: none;
}
.tkpub-search input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tk-ink);
  background: var(--tk-canvas);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 11px 38px 11px 40px;
  transition: border-color .15s, background .15s;
}
.tkpub-search input::placeholder { color: var(--tk-muted); }
.tkpub-search input:focus {
  background: var(--tk-surface);
  border-color: var(--tk-accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--tk-accent-soft);
}
.tkpub-search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: 0; background: none; color: var(--tk-muted);
  width: 26px; height: 26px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
}
.tkpub-search-clear:hover { background: var(--tk-line-soft); color: var(--tk-ink); }
.tkpub-search.is-filled .tkpub-search-clear { display: flex; }

.tkpub-select {
  font: inherit; font-size: 14px;
  color: var(--tk-ink);
  background: var(--tk-canvas)
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%238c8c8c' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5'/%3E%3C/svg%3E")
    no-repeat right 10px center / 15px;
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 11px 32px 11px 12px;
  appearance: none;
  cursor: pointer;
}
.tkpub-select:focus { border-color: var(--tk-accent); outline: none; box-shadow: 0 0 0 3px var(--tk-accent-soft); }

.tkpub-views {
  display: flex; gap: 2px;
  background: var(--tk-canvas);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 3px;
  margin-left: auto;
}
.tkpub-views button {
  border: 0; background: none; color: var(--tk-muted);
  width: 34px; height: 32px; border-radius: 6px;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.tkpub-views button svg { width: 17px; height: 17px; }
.tkpub-views button[aria-pressed="true"] {
  background: var(--tk-surface); color: var(--tk-deep);
  box-shadow: 0 1px 2px rgba(0,0,0,.10);
}

/* Facet chips */
.tkpub-facets {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--tk-line-soft);
}
.tkpub-facet-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--tk-muted);
  align-self: center;
  margin-right: 2px;
}
.tkpub-chip {
  border: 1px solid var(--tk-line);
  background: var(--tk-surface);
  color: var(--tk-body);
  font-size: 13.5px;
  padding: 7px 14px;
  border-radius: var(--tk-radius-pill);
  transition: all .15s;
  display: inline-flex; align-items: center; gap: 7px;
}
.tkpub-chip:hover { border-color: var(--tk-accent); color: var(--tk-accent); }
.tkpub-chip[aria-pressed="true"] {
  background: var(--tk-accent); border-color: var(--tk-accent); color: #fff;
  font-weight: 600;
}
.tkpub-chip-count {
  font-size: 11.5px;
  background: var(--tk-line-soft);
  color: var(--tk-muted);
  padding: 1px 6px; border-radius: var(--tk-radius-pill);
  font-weight: 600;
}
.tkpub-chip[aria-pressed="true"] .tkpub-chip-count { background: rgba(255,255,255,.22); color: #fff; }

.tkpub-reset {
  border: 0; background: none;
  color: var(--tk-alert); font-size: 13.5px; font-weight: 600;
  padding: 7px 4px; text-decoration: underline; text-underline-offset: 3px;
}

.tkpub-resultbar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 14px; color: var(--tk-muted);
}
.tkpub-resultbar strong { color: var(--tk-deep); font-weight: 700; }

/* ==========================================================================
   Featured publication
   ========================================================================== */

.tkpub-featured {
  display: grid;
  grid-template-columns: 210px 1fr;
  gap: 26px;
  background: linear-gradient(125deg, var(--tk-accent) 0%, #fb8518 55%, var(--tk-gold) 100%);
  border-radius: var(--tk-radius);
  padding: 26px;
  margin-bottom: 26px;
  color: #fff;
  box-shadow: var(--tk-shadow);
}
.tkpub-featured .tkpub-cover { box-shadow: var(--tk-shadow-lg); }
.tkpub-featured-body { display: flex; flex-direction: column; align-items: flex-start; }
.tkpub-featured h3 {
  font-size: clamp(20px, 2.4vw, 27px);
  line-height: 1.25; font-weight: 800; color: #fff;
  margin: 10px 0 8px;
  letter-spacing: -.01em;
}
.tkpub-featured p { color: rgba(255,255,255,.82); font-size: 15px; max-width: 60ch; }
.tkpub-featured .tkpub-meta { color: rgba(255,255,255,.7); }
.tkpub-featured .tkpub-meta svg { color: rgba(255,255,255,.55); }
.tkpub-featured .tkpub-actions { margin-top: auto; padding-top: 18px; }
/* On the warm gradient an orange button would disappear — invert it. */
.tkpub-featured .tkpub-btn-primary {
  background: #fff; border-color: #fff; color: var(--tk-accent);
}
.tkpub-featured .tkpub-btn-primary:hover {
  background: var(--tk-deep); border-color: var(--tk-deep); color: #fff;
}
.tkpub-featured .tkpub-btn-ghost {
  border-color: rgba(255,255,255,.55); color: #fff; background: transparent;
}
.tkpub-featured .tkpub-btn-ghost:hover { background: rgba(255,255,255,.16); border-color: #fff; }

.tkpub-flag {
  display: inline-flex; align-items: center; gap: 7px;
  background: #fff; color: var(--tk-accent);
  font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  padding: 5px 11px; border-radius: var(--tk-radius-pill);
}
.tkpub-flag svg { width: 13px; height: 13px; }

/* ==========================================================================
   Grid + cards
   ========================================================================== */

.tkpub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
  gap: var(--tk-gap);
}

.tkpub-card {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 18px;
  display: flex; flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tkpub-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--tk-shadow);
  border-color: var(--tk-accent-soft);
}

/* Cover — real image, or a generated document-looking placeholder */
.tkpub-cover {
  position: relative;
  /* Document covers are portrait, but a full 3:4 makes the grid very tall.
     4:5 keeps the shelf compact; anchoring to the top keeps the cover's
     own title visible when it is cropped. */
  aspect-ratio: var(--tk-cover-ratio, 4 / 5);
  border-radius: var(--tk-radius-sm);
  overflow: hidden;
  background: var(--tk-canvas);
  flex-shrink: 0;
}
.tkpub-cover img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.tkpub-cover-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 16px;
  background: linear-gradient(150deg, var(--tk-c1, #12776f), var(--tk-c2, #0b3c49));
  color: #fff;
}
.tkpub-cover-fallback .tkpub-cf-type {
  font-size: 10.5px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
  opacity: .8;
}
.tkpub-cover-fallback .tkpub-cf-title {
  font-size: 15px; font-weight: 700; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  line-clamp: 4; overflow: hidden;
}
.tkpub-cover-fallback .tkpub-cf-mark {
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; opacity: .65;
}
.tkpub-cover-badge {
  position: absolute; right: 9px; top: 9px;
  background: rgba(35,35,35,.86);
  color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
  padding: 4px 8px; border-radius: 5px;
  backdrop-filter: blur(4px);
}

.tkpub-card .tkpub-cover { margin-bottom: 15px; }

.tkpub-type {
  font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tk-accent);
}

.tkpub-card h3 {
  font-size: 17px; line-height: 1.34; font-weight: 700; color: var(--tk-deep);
  margin: 7px 0 8px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  line-clamp: 3; overflow: hidden;
}

.tkpub-summary {
  font-size: 14px; color: var(--tk-body);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  line-clamp: 3; overflow: hidden;
}

.tkpub-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  margin-top: 13px;
  font-size: 12.5px; color: var(--tk-muted);
}
.tkpub-meta span { display: inline-flex; align-items: center; gap: 5px; }
.tkpub-meta svg { width: 14px; height: 14px; color: var(--tk-line); flex-shrink: 0; }
.tkpub-meta svg { color: #9fb0b1; }

.tkpub-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tkpub-tag {
  font-size: 11.5px; font-weight: 600;
  color: var(--tk-accent-dark); background: var(--tk-accent-soft);
  padding: 3px 9px; border-radius: var(--tk-radius-pill);
  border: 0;
}
.tkpub-tag:hover { background: var(--tk-accent); color: #fff; }

.tkpub-actions {
  display: flex; gap: 9px; flex-wrap: wrap;
  margin-top: auto; padding-top: 16px;
}

/* Buttons mirror the theme's: Quicksand 700, 14px, uppercase, pill. */
.tkpub-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--tk-head-font);
  font-size: 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .01em;
  border-radius: var(--tk-radius-pill);
  padding: 11px 22px;
  border: 2px solid transparent;
  text-decoration: none;
  transition: background .18s, border-color .18s, color .18s;
  white-space: nowrap;
}
.tkpub-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.tkpub-btn-primary { background: var(--tk-accent); border-color: var(--tk-accent); color: #fff; }
/* The theme flips primary buttons to the secondary colour on hover. */
.tkpub-btn-primary:hover { background: var(--tk-gold); border-color: var(--tk-gold); color: #fff; }
.tkpub-btn-ghost { background: transparent; border-color: var(--tk-line); color: var(--tk-body); }
.tkpub-btn-ghost:hover { border-color: var(--tk-accent); color: var(--tk-accent); }
.tkpub-btn-sm { padding: 8px 16px; font-size: 12.5px; }
.tkpub-btn[disabled] { opacity: .55; pointer-events: none; }

/* List view */
.tkpub-grid.is-list { grid-template-columns: 1fr; gap: 14px; }
.tkpub-grid.is-list .tkpub-card {
  display: grid;
  grid-template-columns: 84px 1fr auto;
  grid-template-areas: "cover body actions";
  align-items: center;
  gap: 20px;
  padding: 16px 18px;
}
.tkpub-grid.is-list .tkpub-card:hover { transform: none; }
.tkpub-grid.is-list .tkpub-cover { grid-area: cover; margin: 0; }
.tkpub-grid.is-list .tkpub-card-body { grid-area: body; min-width: 0; }
.tkpub-grid.is-list .tkpub-actions { grid-area: actions; margin: 0; padding: 0; }
.tkpub-grid.is-list .tkpub-summary { -webkit-line-clamp: 2; line-clamp: 2; }
.tkpub-grid.is-list .tkpub-card h3 { -webkit-line-clamp: 2; line-clamp: 2; font-size: 16px; }
.tkpub-grid.is-list .tkpub-tags { display: none; }
.tkpub-grid.is-list .tkpub-cover-fallback { padding: 8px; }
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-title,
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-mark { display: none; }
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-type { font-size: 9px; }
.tkpub-grid.is-list .tkpub-cover-badge { display: none; }

/* ==========================================================================
   States — loading, empty, error
   ========================================================================== */

.tkpub-skeleton {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 18px;
}
.tkpub-sk-line, .tkpub-sk-box {
  background: linear-gradient(90deg, var(--tk-line-soft) 25%, #e3ebeb 37%, var(--tk-line-soft) 63%);
  background-size: 400% 100%;
  animation: tkpub-shimmer 1.4s ease infinite;
  border-radius: 5px;
}
.tkpub-sk-box { aspect-ratio: 3/4; border-radius: var(--tk-radius-sm); margin-bottom: 15px; }
.tkpub-sk-line { height: 11px; margin-bottom: 9px; }
@keyframes tkpub-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) {
  .tkpub-sk-line, .tkpub-sk-box { animation: none; }
  .tkpub-card { transition: none; }
}

.tkpub-state {
  text-align: center;
  padding: 56px 24px;
  background: var(--tk-surface);
  border: 1px dashed var(--tk-line);
  border-radius: var(--tk-radius);
}
.tkpub-state svg { width: 40px; height: 40px; color: var(--tk-line); margin: 0 auto 14px; }
.tkpub-state h3 { font-size: 18px; font-weight: 700; color: var(--tk-deep); margin-bottom: 6px; }
.tkpub-state p { font-size: 14.5px; color: var(--tk-muted); max-width: 46ch; margin: 0 auto 16px; }
.tkpub-state.is-error { border-color: #f0c8c4; background: #fdf6f5; }
.tkpub-state.is-error svg { color: var(--tk-alert); }

.tkpub-more { display: flex; justify-content: center; margin-top: 30px; }

/* ==========================================================================
   PDF viewer modal
   ========================================================================== */

.tkpub-modal {
  position: fixed; inset: 0; z-index: 100000;
  display: none;
  background: rgba(28, 24, 22, .8);
  backdrop-filter: blur(3px);
  padding: 22px;
}
.tkpub-modal.is-open { display: flex; align-items: center; justify-content: center; }

.tkpub-modal-panel {
  background: var(--tk-surface);
  border-radius: var(--tk-radius);
  width: min(1080px, 100%);
  height: min(92vh, 100%);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: var(--tk-shadow-lg);
  animation: tkpub-rise .22s ease;
}
@keyframes tkpub-rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@media (prefers-reduced-motion: reduce) { .tkpub-modal-panel { animation: none; } }

.tkpub-modal-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--tk-line);
  background: var(--tk-canvas);
  flex-shrink: 0;
}
.tkpub-modal-titles { min-width: 0; flex: 1; }
.tkpub-modal-titles h2 {
  font-size: 15.5px; font-weight: 700; color: var(--tk-deep);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tkpub-modal-titles p { font-size: 12.5px; color: var(--tk-muted); }
.tkpub-modal-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.tkpub-icbtn {
  border: 1px solid transparent; background: none; color: var(--tk-body);
  width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.tkpub-icbtn svg { width: 17px; height: 17px; }
.tkpub-icbtn:hover { background: var(--tk-line-soft); color: var(--tk-deep); }
.tkpub-icbtn[disabled] { opacity: .35; pointer-events: none; }
.tkpub-icbtn.is-close:hover { background: #fbe9e7; color: var(--tk-alert); }

.tkpub-pager {
  display: flex; align-items: center; gap: 4px;
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: 8px;
  padding: 2px;
}
.tkpub-pager input {
  width: 44px; text-align: center; font: inherit; font-size: 13px;
  border: 0; background: none; color: var(--tk-ink);
  padding: 5px 2px;
}
.tkpub-pager input:focus { outline: none; background: var(--tk-line-soft); border-radius: 4px; }
.tkpub-pager .tkpub-pagecount { font-size: 13px; color: var(--tk-muted); padding-right: 8px; }
.tkpub-zoomlevel { font-size: 13px; color: var(--tk-muted); min-width: 44px; text-align: center; }

.tkpub-modal-stage {
  flex: 1;
  overflow: auto;

  var CONFIG = {
    mode: "posts",                    // 'posts' | 'cpt'
    restRoot: "/wp-json/",
    parentCategory: "publications",   // posts-mode: parent category slug
    perPage: 9,                       // cards shown before "Load more"
    maxFetch: 500,                    // safety ceiling on total items pulled
    defaultView: "grid",              // 'grid' | 'list'
    defaultSort: "newest",
    // Set to null to disable the in-page renderer and always use the
    // browser's own PDF viewer in an iframe.
    pdfjs: {
      lib: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
      worker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"
    },
    languages: { en: "English", sw: "Kiswahili", fr: "French" },
    org: "Talitha Kum Kenya"
  };

  /* If plugin/tkpub-nonce-snippet.php is installed it also tells us the real
     REST root, which matters on sites where a security plugin or unusual
     permalinks have moved it away from /wp-json/. */
  if (typeof window.tkpubRestRoot === "string" && window.tkpubRestRoot) {
    CONFIG.restRoot = window.tkpubRestRoot;
  }

  /* ------------------------------------------------------------------ */
  /* Tiny helpers                                                        */
  /* ------------------------------------------------------------------ */

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  };

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* Strips HTML that WordPress returns in rendered fields. */
  function plain(html) {
    var d = document.createElement("div");
    d.innerHTML = String(html || "");
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }

  function clip(str, n) {
    str = String(str || "");
    return str.length <= n ? str : str.slice(0, n - 1).replace(/\s+\S*$/, "") + "…";
  }

  function bytes(n) {
    n = Number(n) || 0;
    if (!n) return "";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";
  }

  function prettyDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  }

  /* Publications without a designed cover get a generated one. The gradients
     are drawn from the site's own palette rather than the whole colour wheel,
     so a shelf of generated covers still looks like one organisation.
     Deterministic: a given title always lands on the same gradient. */
  var COVER_GRADIENTS = [
    ["#F74F22", "#B32E0B"],   // primary
    ["#FFAC00", "#E07A00"],   // secondary
    ["#FB8518", "#C4490D"],   // the theme's blend of the two
    ["#3A3A3A", "#151515"],   // heading grey, for the sober documents
    ["#E8622A", "#8C2A08"],
    ["#FFC24D", "#F0850A"]
  ];

  function gradientFor(seed) {
    var h = 0, i;
    for (i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 997;
    return COVER_GRADIENTS[h % COVER_GRADIENTS.length];
  }

  var ICON = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
    read: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2 2 0 0 1 4 4h5a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2Z"/><path d="M22 5.5A2 2 0 0 0 20 4h-5a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22Z"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>',
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.2 6.6.9-4.8 4.7 1.2 6.7L12 17.3 6.1 20.5l1.2-6.7L2.5 9.1l6.6-.9Z"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M9 13h6"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17h.01"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
    zoomIn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M11 8.5v5M8.5 11h5M20 20l-3.5-3.5"/></svg>',
    zoomOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8.5 11h5M20 20l-3.5-3.5"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
    external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"/></svg>'
  };

  /* ------------------------------------------------------------------ */
  /* REST plumbing                                                       */
  /* ------------------------------------------------------------------ */

  function restUrl(path, params) {
    var base = CONFIG.restRoot.replace(/\/+$/, "") + "/" + String(path).replace(/^\/+/, "");
    var qs = [];
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v === undefined || v === null || v === "") return;
      qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
    });
    return base + (qs.length ? (base.indexOf("?") > -1 ? "&" : "?") + qs.join("&") : "");
  }

  function getJSON(path, params) {
    return fetch(restUrl(path, params), { credentials: "same-origin" }).then(function (res) {
      if (!res.ok) {
        return res.json().then(
          function (body) { throw new Error(body && body.message ? body.message : "HTTP " + res.status); },
          function () { throw new Error("HTTP " + res.status); }
        );
      }
      return res.json().then(function (data) {
        return { data: data, totalPages: Number(res.headers.get("X-WP-TotalPages") || 1) };
      });
    });
  }

  /* Pulls every page of a collection, up to CONFIG.maxFetch items. */
  function getAll(path, params) {
    var out = [];
    function page(n) {
      var p = Object.assign({}, params, { per_page: 100, page: n });
      return getJSON(path, p).then(function (r) {
        out = out.concat(r.data);
        if (n < r.totalPages && out.length < CONFIG.maxFetch) return page(n + 1);
        return out;
      });
    }
    return page(1);
  }

  /* ------------------------------------------------------------------ */
  /* Normalising both data modes into one publication shape              */
  /* ------------------------------------------------------------------ */

  var PAYLOAD_RE = /<!--\s*TKPUB:(\{[\s\S]*?\})\s*-->/;

  function readPayload(rendered) {
    var m = PAYLOAD_RE.exec(String(rendered || ""));
    if (!m) return {};
    try { return JSON.parse(m[1]); } catch (e) { return {}; }
  }

  function stripPayload(rendered) {
    return String(rendered || "").replace(PAYLOAD_RE, "");
  }

  function embeddedTerms(item) {
    var groups = (item._embedded && item._embedded["wp:term"]) || [];
    var all = [];
    groups.forEach(function (g) { if (Array.isArray(g)) all = all.concat(g); });
    return all;
  }

  function embeddedCover(item) {
    var m = item._embedded && item._embedded["wp:featuredmedia"];
    if (!m || !m[0] || m[0].code) return { url: "", alt: "" };
    var media = m[0];
    var sizes = media.media_details && media.media_details.sizes;
    var pick = sizes && (sizes.medium_large || sizes.large || sizes.medium);
    return { url: (pick && pick.source_url) || media.source_url || "", alt: media.alt_text || "" };
  }

  function normalise(item, ctx) {
    var pub;

    if (CONFIG.mode === "cpt" && item.tk) {
      /* Plugin mode — the REST field does the work for us. */
      pub = {
        id: item.id,
        slug: item.slug,
        status: item.status,
        title: plain(item.title && item.title.rendered),
        summary: plain(item.excerpt && item.excerpt.rendered),
        date: item.date,
        link: item.link,
        pdf: item.tk.pdf_url || "",
        pages: Number(item.tk.pdf_pages) || 0,
        size: Number(item.tk.pdf_size) || 0,
        cover: item.tk.cover_url || "",
        coverAlt: item.tk.cover_alt || "",
        lang: item.tk.language || "en",
        issuer: item.tk.issuer || CONFIG.org,
        featured: !!item.tk.featured,
        downloads: Number(item.tk.downloads) || 0,
        type: (item.tk.type && item.tk.type[0]) ? item.tk.type[0].name : "Publication",
        typeSlug: (item.tk.type && item.tk.type[0]) ? item.tk.type[0].slug : "",
        themes: (item.tk.themes || []).map(function (t) { return t.name; }),
        keywords: (item.tk.keywords || []).map(function (t) { return t.name; })
      };
    } else {
      /* Posts mode — read the embedded payload and the category tree. */
      var data = readPayload(item.content && item.content.rendered);
      var terms = embeddedTerms(item);
      var cover = embeddedCover(item);

      var typeTerm = null, themes = [];
      terms.forEach(function (t) {
        if (t.taxonomy === "category") {
          if (t.parent === ctx.parentId) typeTerm = typeTerm || t;
        } else if (t.taxonomy === "post_tag") {
          themes.push(t.name);
        }
      });

      var summary = plain(item.excerpt && item.excerpt.rendered);
      if (!summary) summary = clip(plain(stripPayload(item.content && item.content.rendered)), 220);

      pub = {
        id: item.id,
        slug: item.slug,
        status: item.status,
        title: plain(item.title && item.title.rendered),
        summary: summary,
        date: data.date || item.date,
        link: item.link,
        pdf: data.pdf || "",
        pages: Number(data.pages) || 0,
        size: Number(data.size) || 0,
        cover: cover.url || data.cover || "",
        coverAlt: cover.alt || "",
        lang: data.lang || "en",
        issuer: data.issuer || CONFIG.org,
        featured: !!data.featured,
        downloads: Number(data.downloads) || 0,
        type: typeTerm ? typeTerm.name : "Publication",
        typeSlug: typeTerm ? typeTerm.slug : "",
        themes: themes.slice(0, 3),
        keywords: themes
      };
    }

    pub.year = String(new Date(pub.date).getFullYear() || "");
    pub.langLabel = CONFIG.languages[pub.lang] || pub.lang;
    /* Pre-built haystack so search stays fast on every keystroke. */
    pub.haystack = [pub.title, pub.summary, pub.type, pub.issuer, pub.keywords.join(" ")]
      .join(" ").toLowerCase();
    return pub;
  }

  /* ------------------------------------------------------------------ */
  /* State                                                               */
  /* ------------------------------------------------------------------ */

  var state = {
    all: [],
    filtered: [],
    parentId: null,
    q: "",
    type: "",
    themes: [],
    year: "",
    lang: "",
    sort: CONFIG.defaultSort,
    view: CONFIG.defaultView,
    shown: CONFIG.perPage
  };

  var el = {};

  /* ------------------------------------------------------------------ */
  /* Rendering                                                           */
  /* ------------------------------------------------------------------ */

  function coverMarkup(pub, showBadge) {
    if (pub.cover) {
      return '<div class="tkpub-cover">' +
        '<img src="' + esc(pub.cover) + '" alt="' + esc(pub.coverAlt || ("Cover of " + pub.title)) + '" loading="lazy">' +
        (showBadge && pub.pages ? '<span class="tkpub-cover-badge">' + pub.pages + ' pp</span>' : "") +
        "</div>";
    }
    var g = gradientFor(pub.title || pub.slug || "x");
    return '<div class="tkpub-cover" style="--tk-c1:' + g[0] + ';--tk-c2:' + g[1] + '">' +
      '<div class="tkpub-cover-fallback" aria-hidden="true">' +
        '<span class="tkpub-cf-type">' + esc(pub.type) + "</span>" +
        '<span class="tkpub-cf-title">' + esc(clip(pub.title, 72)) + "</span>" +
        '<span class="tkpub-cf-mark">' + esc(CONFIG.org) + "</span>" +
      "</div>" +
      (showBadge && pub.pages ? '<span class="tkpub-cover-badge">' + pub.pages + ' pp</span>' : "") +
      "</div>";
  }

  function metaMarkup(pub) {
    var bits = [];
    bits.push("<span>" + ICON.cal + esc(prettyDate(pub.date)) + "</span>");
    if (pub.pages) bits.push("<span>" + ICON.page + pub.pages + " pages</span>");
    if (pub.size) bits.push("<span>" + ICON.down + esc(bytes(pub.size)) + "</span>");
    if (pub.lang && pub.lang !== "en") bits.push("<span>" + ICON.globe + esc(pub.langLabel) + "</span>");
    return '<div class="tkpub-meta">' + bits.join("") + "</div>";
  }

  function actionsMarkup(pub, small) {
    var sz = small ? " tkpub-btn-sm" : "";
    if (!pub.pdf) {
      return '<div class="tkpub-actions">' +
        '<a class="tkpub-btn tkpub-btn-ghost' + sz + '" href="' + esc(pub.link) + '">' + ICON.external + "Read online</a></div>";
    }
    return '<div class="tkpub-actions">' +
      '<button type="button" class="tkpub-btn tkpub-btn-primary' + sz + '" data-open="' + esc(pub.slug) + '">' +
        ICON.read + "Read</button>" +
      '<a class="tkpub-btn tkpub-btn-ghost' + sz + '" href="' + esc(pub.pdf) + '" download data-download="' + pub.id + '">' +
        ICON.down + "Download</a>" +
      "</div>";
  }

  function cardMarkup(pub) {
    return '<article class="tkpub-card">' +
      coverMarkup(pub, true) +
      '<div class="tkpub-card-body">' +
        '<p class="tkpub-type">' + esc(pub.type) + "</p>" +
        "<h3>" + esc(pub.title) + "</h3>" +
        '<p class="tkpub-summary">' + esc(pub.summary) + "</p>" +
        metaMarkup(pub) +
        (pub.themes.length
          ? '<div class="tkpub-tags">' + pub.themes.map(function (t) {
              return '<button type="button" class="tkpub-tag" data-theme="' + esc(t) + '">' + esc(t) + "</button>";
            }).join("") + "</div>"
          : "") +
      "</div>" +
      actionsMarkup(pub) +
      "</article>";
  }

  function featuredMarkup(pub) {
    return '<section class="tkpub-featured">' +
      coverMarkup(pub, false) +
      '<div class="tkpub-featured-body">' +
        '<span class="tkpub-flag">' + ICON.star + "Latest release</span>" +
        "<h3>" + esc(pub.title) + "</h3>" +
        "<p>" + esc(clip(pub.summary, 260)) + "</p>" +
        metaMarkup(pub) +
        actionsMarkup(pub) +
      "</div>" +
      "</section>";
  }

  function skeletons(n) {
    var one = '<div class="tkpub-skeleton"><div class="tkpub-sk-box"></div>' +
      '<div class="tkpub-sk-line" style="width:35%"></div>' +
      '<div class="tkpub-sk-line" style="width:92%"></div>' +
      '<div class="tkpub-sk-line" style="width:70%"></div></div>';
    return new Array(n + 1).join(one);
  }

  function stateBlock(icon, title, body, action, isError) {
    return '<div class="tkpub-state' + (isError ? " is-error" : "") + '">' + icon +
      "<h3>" + esc(title) + "</h3><p>" + esc(body) + "</p>" + (action || "") + "</div>";
  }

  /* ------------------------------------------------------------------ */
  /* Facets                                                              */
  /* ------------------------------------------------------------------ */

  function countBy(list, keyFn) {
    var map = {};
    list.forEach(function (p) {
      var keys = keyFn(p);
      (Array.isArray(keys) ? keys : [keys]).forEach(function (k) {
        if (!k) return;
        map[k] = (map[k] || 0) + 1;
      });
    });
    return map;
  }

  function renderFacets() {
    var types = countBy(state.all, function (p) { return p.type; });
    var themes = countBy(state.all, function (p) { return p.themes; });

    var typeHtml = ['<span class="tkpub-facet-label">Type</span>',
      '<button type="button" class="tkpub-chip" data-type="" aria-pressed="' + (!state.type) + '">All</button>'];
    Object.keys(types).sort().forEach(function (t) {
      typeHtml.push('<button type="button" class="tkpub-chip" data-type="' + esc(t) + '" aria-pressed="' +
        (state.type === t) + '">' + esc(t) + '<span class="tkpub-chip-count">' + types[t] + "</span></button>");
    });
    el.typeFacets.innerHTML = typeHtml.join("");

    var themeKeys = Object.keys(themes).sort(function (a, b) { return themes[b] - themes[a] || a.localeCompare(b); });
    var themeHtml = ['<span class="tkpub-facet-label">Theme</span>'];
    themeKeys.forEach(function (t) {
      themeHtml.push('<button type="button" class="tkpub-chip" data-theme="' + esc(t) + '" aria-pressed="' +
        (state.themes.indexOf(t) > -1) + '">' + esc(t) + '<span class="tkpub-chip-count">' + themes[t] + "</span></button>");
    });
    if (hasFilters()) {
      themeHtml.push('<button type="button" class="tkpub-reset" data-reset>Clear all filters</button>');
    }
    el.themeFacets.innerHTML = themeKeys.length > 1 ? themeHtml.join("") : (hasFilters()
      ? '<button type="button" class="tkpub-reset" data-reset>Clear all filters</button>' : "");

    /* Year + language selects */
    var years = Object.keys(countBy(state.all, function (p) { return p.year; }))
      .sort().reverse();
    el.year.innerHTML = '<option value="">All years</option>' + years.map(function (y) {
      return '<option value="' + esc(y) + '"' + (state.year === y ? " selected" : "") + ">" + esc(y) + "</option>";
    }).join("");

    var langs = Object.keys(countBy(state.all, function (p) { return p.lang; }));
    if (langs.length > 1) {
      el.lang.hidden = false;
      el.lang.innerHTML = '<option value="">All languages</option>' + langs.map(function (l) {
        return '<option value="' + esc(l) + '"' + (state.lang === l ? " selected" : "") + ">" +
          esc(CONFIG.languages[l] || l) + "</option>";
      }).join("");
    } else {
      el.lang.hidden = true;
    }
  }

  function hasFilters() {
    return !!(state.q || state.type || state.themes.length || state.year || state.lang);
  }

  /* ------------------------------------------------------------------ */
  /* Filter + paint                                                      */
  /* ------------------------------------------------------------------ */

  function applyFilters() {
    var q = state.q.toLowerCase().trim();
    var terms = q ? q.split(/\s+/) : [];

    state.filtered = state.all.filter(function (p) {
      if (state.type && p.type !== state.type) return false;
      if (state.year && p.year !== state.year) return false;
      if (state.lang && p.lang !== state.lang) return false;
      if (state.themes.length) {
        var ok = state.themes.every(function (t) { return p.keywords.indexOf(t) > -1; });
        if (!ok) return false;
      }
      /* Every word must appear somewhere — narrows sensibly as you type. */
      return terms.every(function (t) { return p.haystack.indexOf(t) > -1; });
    });

    var dir = state.sort === "oldest" ? 1 : -1;
    state.filtered.sort(function (a, b) {
      if (state.sort === "az") return a.title.localeCompare(b.title);
      if (state.sort === "za") return b.title.localeCompare(a.title);
      return (new Date(a.date) - new Date(b.date)) * dir;
    });

    state.shown = CONFIG.perPage;
    paint();
  }

  function paint() {
    var list = state.filtered;

    /* The newest publication gets the hero treatment, but only on an
       unfiltered, newest-first view — otherwise it is just noise. */
    var showFeatured = !hasFilters() && state.sort === "newest" && list.length > 2;
    var featured = null, rest = list;
    if (showFeatured) {
      featured = list.filter(function (p) { return p.featured; })[0] || list[0];
      rest = list.filter(function (p) { return p !== featured; });
    }

    el.featured.innerHTML = featured ? featuredMarkup(featured) : "";

    if (!list.length) {
      el.grid.className = "tkpub-grid";
      el.grid.innerHTML = "";
      el.empty.innerHTML = stateBlock(
        ICON.empty,
        hasFilters() ? "No publications match those filters" : "No publications yet",
        hasFilters()
          ? "Try removing a filter or searching for a broader term."
          : "New documents are added regularly. Please check back soon.",
        hasFilters() ? '<button type="button" class="tkpub-btn tkpub-btn-ghost" data-reset>Clear all filters</button>' : ""
      );
      el.more.innerHTML = "";
    } else {
      el.empty.innerHTML = "";
      el.grid.className = "tkpub-grid" + (state.view === "list" ? " is-list" : "");
      var slice = rest.slice(0, state.shown);
      el.grid.innerHTML = slice.map(cardMarkup).join("");
      var remaining = rest.length - slice.length;
      el.more.innerHTML = remaining > 0
        ? '<button type="button" class="tkpub-btn tkpub-btn-ghost" data-more>Load ' +
          Math.min(remaining, CONFIG.perPage) + " more of " + remaining + "</button>"
        : "";
    }

    var n = list.length;
    el.count.innerHTML = "<strong>" + n + "</strong> publication" + (n === 1 ? "" : "s") +
      (hasFilters() ? " matching your filters" : "");
    el.live.textContent = n + " publication" + (n === 1 ? "" : "s") + " found";

    renderFacets();
  }

  /* ------------------------------------------------------------------ */
  /* PDF viewer                                                          */
  /* ------------------------------------------------------------------ */

  var viewer = {
    pub: null, doc: null, page: 1, zoom: 1, fitWidth: true,
    lastFocus: null, rendering: false, pending: null, token: 0
  };

  var pdfjsPromise = null;

  function loadPdfJs() {
    if (!CONFIG.pdfjs) return Promise.reject(new Error("disabled"));
    if (pdfjsPromise) return pdfjsPromise;
    pdfjsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = CONFIG.pdfjs.lib;
      s.onload = function () {
        var lib = window.pdfjsLib;
        if (!lib) return reject(new Error("pdf.js did not initialise"));
        lib.GlobalWorkerOptions.workerSrc = CONFIG.pdfjs.worker;
        resolve(lib);
      };
      s.onerror = function () { reject(new Error("pdf.js could not be loaded")); };
      document.head.appendChild(s);
    });
    return pdfjsPromise;
  }

  function openViewer(slug, pushUrl) {
    var pub = state.all.filter(function (p) { return p.slug === slug; })[0];
    if (!pub || !pub.pdf) return;

    viewer.pub = pub;
    viewer.page = 1;
    viewer.zoom = 1;
    viewer.fitWidth = true;
    viewer.doc = null;
    viewer.token++;
    viewer.lastFocus = document.activeElement;

    $(".tkpub-modal-titles h2", el.modal).textContent = pub.title;
    $(".tkpub-modal-titles p", el.modal).textContent =
      [pub.type, prettyDate(pub.date), pub.issuer].filter(Boolean).join("  ·  ");
    $("[data-dl]", el.modal).href = pub.pdf;
    $("[data-dl]", el.modal).setAttribute("data-download", pub.id);
    $("[data-tab]", el.modal).href = pub.pdf;
    el.modalFoot.innerHTML = metaMarkup(pub);

    el.modal.classList.add("is-open");
    document.body.classList.add("tkpub-locked");
    $(".tkpub-icbtn.is-close", el.modal).focus();

    if (pushUrl !== false) {
      try {
        var u = new URL(window.location.href);
        u.searchParams.set("publication", pub.slug);
        history.pushState({ tkpub: pub.slug }, "", u.toString());
      } catch (e) { /* older browsers — deep links simply do not update */ }
    }

    renderStage();
  }

  function closeViewer(popState) {
    if (!el.modal.classList.contains("is-open")) return;
    el.modal.classList.remove("is-open");
    document.body.classList.remove("tkpub-locked");
    viewer.token++;
    viewer.doc = null;
    el.stage.innerHTML = "";
    if (viewer.lastFocus && viewer.lastFocus.focus) viewer.lastFocus.focus();

    if (!popState) {
      try {
        var u = new URL(window.location.href);
        if (u.searchParams.has("publication")) {
          u.searchParams.delete("publication");
          history.pushState({}, "", u.toString());
        }
      } catch (e) { /* no-op */ }
    }
  }

  function stageMessage(html) {
    el.stage.className = "tkpub-modal-stage";
    el.stage.innerHTML = '<div class="tkpub-viewer-msg">' + html + "</div>";
  }

  /* Browsers that refuse to render a PDF in an iframe (most mobile ones)
     get an explicit escape hatch rather than a blank grey box. */
  function fallbackFrame(reason) {
    var pub = viewer.pub;
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    setPagerEnabled(false);

    if (mobile) {
      stageMessage(
        "<h3>Open this document</h3>" +
        "<p>" + esc(reason || "Your browser cannot display PDFs inside a page.") +
        " You can still read or save it in one tap.</p>" +
        '<a class="tkpub-btn tkpub-btn-primary" href="' + esc(pub.pdf) + '" target="_blank" rel="noopener">' +
          ICON.external + "Open the PDF</a>"
      );
      return;
    }
    el.stage.className = "tkpub-modal-stage is-frame";
    el.stage.innerHTML = '<iframe src="' + esc(pub.pdf) + '#view=FitH" title="' +
      esc(pub.title) + '" loading="lazy"></iframe>';
  }

  function setPagerEnabled(on, total) {
    var pager = $(".tkpub-pager", el.modal);
    pager.style.display = on ? "" : "none";
    $$(".tkpub-zoom", el.modal).forEach(function (b) { b.style.display = on ? "" : "none"; });
    el.zoomLevel.style.display = on ? "" : "none";
    if (on && total) $(".tkpub-pagecount", el.modal).textContent = "/ " + total;
  }

  function renderStage() {
    var pub = viewer.pub;
    var token = viewer.token;

    stageMessage('<div class="tkpub-spinner"></div><p>Loading document…</p>');
    setPagerEnabled(false);

    /* Optional escape hatch: set CONFIG.renderer to a function and it takes
       over the viewer body completely. Used by the offline design preview,
       and there if you ever want to self-host a different PDF engine. */
    if (typeof CONFIG.renderer === "function") {
      CONFIG.renderer({ stage: el.stage, modal: el.modal, pub: pub, setPager: setPagerEnabled });
      return;
    }

    loadPdfJs()
      .then(function (lib) {
        if (token !== viewer.token) return null;
        return lib.getDocument({ url: pub.pdf, withCredentials: false }).promise;
      })
      .then(function (doc) {
        if (!doc || token !== viewer.token) return;
        viewer.doc = doc;
        el.stage.className = "tkpub-modal-stage";
        el.stage.innerHTML = "<canvas></canvas>";
        setPagerEnabled(true, doc.numPages);
        $(".tkpub-pager input", el.modal).value = "1";
        renderPage(1);
      })
      .catch(function (err) {
        if (token !== viewer.token) return;
        /* A cross-origin PDF, a blocked CDN or an old browser all land here. */
        fallbackFrame(err && err.message === "disabled"
          ? "" : "The in-page reader could not start.");
      });
  }

  function renderPage(n) {
    if (!viewer.doc) return;
    var total = viewer.doc.numPages;
    n = Math.min(Math.max(1, n | 0), total);
    viewer.page = n;

    if (viewer.rendering) { viewer.pending = n; return; }
    viewer.rendering = true;

    var token = viewer.token;
    viewer.doc.getPage(n).then(function (page) {
      if (token !== viewer.token) { viewer.rendering = false; return; }

      var canvas = $("canvas", el.stage);
      if (!canvas) { viewer.rendering = false; return; }

      var base = page.getViewport({ scale: 1 });
      var avail = el.stage.clientWidth - 40;
      var scale = viewer.fitWidth ? Math.min(avail / base.width, 2) : viewer.zoom;
      /* Render at device resolution so text is crisp on retina screens. */
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = page.getViewport({ scale: scale * dpr });

      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = (vp.width / dpr) + "px";
      canvas.style.height = (vp.height / dpr) + "px";

      return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise
        .then(function () {
          viewer.zoom = scale;
          el.zoomLevel.textContent = Math.round(scale * 100) + "%";
          $(".tkpub-pager input", el.modal).value = String(n);
          $("[data-prev]", el.modal).disabled = n <= 1;
          $("[data-next]", el.modal).disabled = n >= total;
        });
    }).catch(function () {
      fallbackFrame("This page could not be rendered.");
    }).then(function () {
      viewer.rendering = false;
      if (viewer.pending !== null && viewer.pending !== undefined) {
        var next = viewer.pending;
        viewer.pending = null;
        renderPage(next);
      }
    });
  }

  function zoomBy(delta) {
    if (!viewer.doc) return;
    viewer.fitWidth = false;
    viewer.zoom = Math.min(Math.max(viewer.zoom + delta, 0.4), 3);
    renderPage(viewer.page);
  }

  /* ------------------------------------------------------------------ */
  /* Download counting (plugin mode only — silently skipped otherwise)   */
  /* ------------------------------------------------------------------ */

  function countDownload(id) {
    if (CONFIG.mode !== "cpt" || !id) return;
    fetch(restUrl("talithakum/v1/publications/" + id + "/download"), {
      method: "POST", credentials: "same-origin"
    }).catch(function () { /* a failed counter must never break a download */ });
  }

  /* ------------------------------------------------------------------ */
  /* Toasts — shared with the admin panel                                */
  /* ------------------------------------------------------------------ */

  function toast(message, kind) {
    var host = $(".tkpub-toasts") || (function () {
      var d = document.createElement("div");
      d.className = "tkpub-toasts";
      d.setAttribute("role", "status");
      d.setAttribute("aria-live", "polite");
      document.body.appendChild(d);
      return d;
    })();
    var t = document.createElement("div");
    t.className = "tkpub-toast" + (kind ? " is-" + kind : "");
    t.innerHTML = (kind === "err" ? ICON.warn : ICON.check) + "<span>" + esc(message) + "</span>";
    host.appendChild(t);
    setTimeout(function () {
      t.style.opacity = "0";
      t.style.transition = "opacity .25s";
      setTimeout(function () { t.remove(); }, 260);
    }, kind === "err" ? 6000 : 3600);
  }

  /* ------------------------------------------------------------------ */
  /* Events                                                              */
  /* ------------------------------------------------------------------ */

  function wire() {
    /* Search */
    var onSearch = debounce(function () {
      state.q = el.search.value;
      el.search.parentNode.classList.toggle("is-filled", !!state.q);
      applyFilters();
    }, 180);
    el.search.addEventListener("input", onSearch);
    $(".tkpub-search-clear").addEventListener("click", function () {
      el.search.value = "";
      state.q = "";
      el.search.parentNode.classList.remove("is-filled");
      el.search.focus();
      applyFilters();
    });

    el.sort.addEventListener("change", function () { state.sort = this.value; applyFilters(); });
    el.year.addEventListener("change", function () { state.year = this.value; applyFilters(); });
    el.lang.addEventListener("change", function () { state.lang = this.value; applyFilters(); });

    $$("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.view = btn.getAttribute("data-view");
        $$("[data-view]").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b === btn));
        });
        try { localStorage.setItem("tkpub:view", state.view); } catch (e) { /* private mode */ }
        paint();
      });
    });

    /* One delegated listener for everything inside the results area. */
    el.root.addEventListener("click", function (ev) {
      var t = ev.target.closest("[data-type],[data-theme],[data-reset],[data-more],[data-open],[data-download]");
      if (!t || !el.root.contains(t)) return;

      if (t.hasAttribute("data-open")) {
        ev.preventDefault();
        openViewer(t.getAttribute("data-open"));
      } else if (t.hasAttribute("data-download")) {
        countDownload(Number(t.getAttribute("data-download")));
      } else if (t.hasAttribute("data-type")) {
        state.type = t.getAttribute("data-type");
        applyFilters();
      } else if (t.hasAttribute("data-theme")) {
        var theme = t.getAttribute("data-theme");
        var i = state.themes.indexOf(theme);
        if (i > -1) state.themes.splice(i, 1); else state.themes.push(theme);
        applyFilters();
      } else if (t.hasAttribute("data-reset")) {
        state.q = ""; state.type = ""; state.themes = []; state.year = ""; state.lang = "";
        el.search.value = "";
        el.search.parentNode.classList.remove("is-filled");
        applyFilters();
      } else if (t.hasAttribute("data-more")) {
        state.shown += CONFIG.perPage;
        paint();
        /* Keep the keyboard user roughly where they were. */
        var cards = $$(".tkpub-card", el.grid);
        var next = cards[state.shown - CONFIG.perPage];
        if (next) next.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    });

    /* Viewer controls */
    el.modal.addEventListener("click", function (ev) {
      if (ev.target === el.modal) return closeViewer();
      var t = ev.target.closest("button, a");
      if (!t) return;
      if (t.hasAttribute("data-close")) closeViewer();
      else if (t.hasAttribute("data-prev")) renderPage(viewer.page - 1);
      else if (t.hasAttribute("data-next")) renderPage(viewer.page + 1);
      else if (t.hasAttribute("data-zoomin")) zoomBy(0.25);
      else if (t.hasAttribute("data-zoomout")) zoomBy(-0.25);
      else if (t.hasAttribute("data-dl")) countDownload(Number(t.getAttribute("data-download")));
      else if (t.hasAttribute("data-copy")) {
        var url = window.location.href;
        (navigator.clipboard
          ? navigator.clipboard.writeText(url)
          : Promise.reject()
        ).then(
          function () { toast("Link copied to your clipboard", "ok"); },
          function () { window.prompt("Copy this link:", url); }
        );
      }
    });

    $(".tkpub-pager input", el.modal).addEventListener("change", function () {
      renderPage(parseInt(this.value, 10) || 1);
    });

    document.addEventListener("keydown", function (ev) {
      if (!el.modal.classList.contains("is-open")) return;
      if (ev.key === "Escape") return closeViewer();
      if (ev.target.tagName === "INPUT") return;
      if (ev.key === "ArrowRight" || ev.key === "PageDown") { ev.preventDefault(); renderPage(viewer.page + 1); }
      if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); renderPage(viewer.page - 1); }
      if (ev.key === "+" || ev.key === "=") zoomBy(0.25);
      if (ev.key === "-") zoomBy(-0.25);
      if (ev.key === "Tab") trapFocus(ev);
    });

    /* Re-fit the page when the window changes size. */
    window.addEventListener("resize", debounce(function () {
      if (viewer.doc && viewer.fitWidth) renderPage(viewer.page);
    }, 220));

    /* Back button closes the viewer instead of leaving the page. */
    window.addEventListener("popstate", function () {
      var slug = new URLSearchParams(window.location.search).get("publication");
      if (slug) openViewer(slug, false); else closeViewer(true);
    });
  }

  function trapFocus(ev) {
    var focusables = $$(
      'button:not([disabled]), a[href], input, [tabindex]:not([tabindex="-1"])',
      el.modal
    ).filter(function (n) { return n.offsetParent !== null; });
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */

  function fetchPublications() {
    if (CONFIG.mode === "cpt") {
      return getAll("wp/v2/publications", { _embed: 1, orderby: "date", order: "desc" });
    }
    /* posts-mode needs the parent category resolved first so we can both
       scope the query and tell "type" categories apart from other ones. */
    return getJSON("wp/v2/categories", { slug: CONFIG.parentCategory, per_page: 1 })
      .then(function (r) {
        if (!r.data.length) {
          throw new Error(
            'No category named "' + CONFIG.parentCategory + '" was found. Create it in ' +
            "WordPress under Posts → Categories, then reload this page."
          );
        }
        state.parentId = r.data[0].id;
        /* Include children so a post filed under "Annual Report" is found. */
        return getAll("wp/v2/posts", {
          categories: state.parentId,
          _embed: 1, orderby: "date", order: "desc"
        });
      });
  }

  function boot() {
    el.root = $(".tkpub");
    if (!el.root) return;

    el.search = $("#tkpub-search");
    el.sort = $("#tkpub-sort");
    el.year = $("#tkpub-year");
    el.lang = $("#tkpub-lang");
    el.typeFacets = $("#tkpub-type-facets");
    el.themeFacets = $("#tkpub-theme-facets");
    el.featured = $("#tkpub-featured");
    el.grid = $("#tkpub-grid");
    el.empty = $("#tkpub-empty");
    el.more = $("#tkpub-more");
    el.count = $("#tkpub-count");
    el.live = $("#tkpub-live");
    el.modal = $("#tkpub-modal");
    el.stage = $("#tkpub-stage");
    el.modalFoot = $("#tkpub-modal-foot-meta");
    el.zoomLevel = $(".tkpub-zoomlevel", el.modal);

    try {
      var savedView = localStorage.getItem("tkpub:view");
      if (savedView) state.view = savedView;
    } catch (e) { /* private mode */ }
    $$("[data-view]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === state.view));
    });

    el.grid.innerHTML = skeletons(6);
    wire();

    fetchPublications()
      .then(function (items) {
        state.all = items
          .map(function (i) { return normalise(i, { parentId: state.parentId }); })
          .filter(function (p) { return p.title; });
        applyFilters();

        /* Honour a shared deep link once the data is in. */
        var slug = new URLSearchParams(window.location.search).get("publication");
        if (slug) openViewer(slug, false);

        document.dispatchEvent(new CustomEvent("tkpub:ready", { detail: { count: state.all.length } }));
      })
      .catch(function (err) {
        el.grid.innerHTML = "";
        el.empty.innerHTML = stateBlock(
          ICON.warn,
          "The publications could not be loaded",
          (err && err.message) || "Something went wrong reaching the site.",
          '<button type="button" class="tkpub-btn tkpub-btn-ghost" onclick="location.reload()">Try again</button>',
          true
        );
      });
  }

  /* Exposed so the admin panel can reuse the plumbing and refresh the list
     after publishing, without a page reload. */
  window.TKPUB = {
    config: CONFIG,
    icons: ICON,
    esc: esc,
    bytes: bytes,
    prettyDate: prettyDate,
    restUrl: restUrl,
    toast: toast,
    loadPdfJs: loadPdfJs,
    reload: function () {
      return fetchPublications().then(function (items) {
        state.all = items
          .map(function (i) { return normalise(i, { parentId: state.parentId }); })
          .filter(function (p) { return p.title; });
        applyFilters();
      });
    },
    get parentId() { return state.parentId; }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

<script>
/* ==========================================================================
   Talitha Kum RAHT Kenya — Publications repository (admin panel)

   A front-end publishing form for staff, so nobody has to learn the
   WordPress admin to put a document online.

   HOW ACCESS IS CONTROLLED — read this before changing anything
   -------------------------------------------------------------
   1. The panel is only *drawn* when WordPress has marked the visitor as
      logged in (it puts a `logged-in` class on <body>). This is cosmetic:
      it stops the panel appearing for the public, nothing more.
   2. It then signs the user in one of two ways:

      a) THE WORDPRESS SESSION THEY ALREADY HAVE. If a REST nonce is present
         on the page, the panel uses the login cookie and skips the form
         entirely. WordPress requires that nonce on any cookie-authenticated
         write — it is what stops another site from making a logged-in
         admin's browser publish things — and only the server can mint one.
         See plugin/tkpub-nonce-snippet.php for the ten lines that print it.

      b) AN APPLICATION PASSWORD, if no nonce is available. Users → Profile →
         Application Passwords. This always works, needs nothing on the
         server, and stays as the fallback.

      Either way the panel refuses to open unless the account can publish.
   3. The real security is WordPress itself. Every write below goes through
      the REST API, which independently re-checks the user's capabilities on
      the server. A visitor who forges the body class, edits this file in
      their browser, or calls the API directly still gets a 401.

   Application Password credentials are held in sessionStorage and disappear
   when the tab closes, unless the user ticks "stay signed in on this device".
   Nothing is stored at all in the cookie case — there is nothing to store.
   ========================================================================== */

(function () {
  "use strict";

  var TK = window.TKPUB;
  if (!TK) return;

  var CONFIG = TK.config;
  var esc = TK.esc, toast = TK.toast, bytes = TK.bytes;

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var STORE_KEY = "tkpub:auth";

  /* Defaults offered in the form. They are created in WordPress on first use,
     so the site starts with a clean, consistent vocabulary instead of whatever
     each contributor happens to type. See docs/taxonomy.md. */
  var TYPES = [
    "Annual Report", "Research & Data", "Policy Brief", "Newsletter",
    "Training Manual", "Awareness Material", "Prayer & Reflection",
    "Press Release", "Conference Paper"
  ];
  var THEMES = [
    "Prevention", "Protection", "Partnership", "Prayer",
    "Child Trafficking", "Labour Exploitation", "Safe Migration", "Survivor Care",
    "Digital Safety", "Youth & Schools", "Advocacy", "Faith Formation"
  ];

  var MAX_PDF = 25 * 1024 * 1024;   // refuse before upload rather than after
  var MAX_IMG = 3 * 1024 * 1024;

  /* ------------------------------------------------------------------ */
  /* Auth                                                                */
  /* ------------------------------------------------------------------ */

  var auth = { header: null, nonce: null, user: null, remember: false };

  /* A REST nonce, if the site prints one. Checked in order:
       tkpubNonce      — set by plugin/tkpub-nonce-snippet.php (or the plugin)
       wpApiSettings   — printed automatically when anything on the page
                         enqueues wp-api-request / wp-api-fetch
     Absent on most front ends, which is why the snippet exists. */
  function findNonce() {
    if (typeof window.tkpubNonce === "string" && window.tkpubNonce) return window.tkpubNonce;
    if (window.wpApiSettings && window.wpApiSettings.nonce) return window.wpApiSettings.nonce;
    return null;
  }

  function usingCookie() { return !!auth.nonce && !auth.header; }

  function loadAuth() {
    var raw = null;
    try { raw = sessionStorage.getItem(STORE_KEY) || localStorage.getItem(STORE_KEY); }
    catch (e) { return; }
    if (!raw) return;
    try {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.header) auth = parsed;
    } catch (e) { /* corrupt entry — ignore it */ }
  }

  function saveAuth() {
    var raw = JSON.stringify(auth);
    try {
      if (auth.remember) localStorage.setItem(STORE_KEY, raw);
      else sessionStorage.setItem(STORE_KEY, raw);
    } catch (e) { /* private browsing — the session simply will not persist */ }
  }

  function clearAuth() {
    auth = { header: null, nonce: null, user: null, remember: false };
    try {
      sessionStorage.removeItem(STORE_KEY);
      localStorage.removeItem(STORE_KEY);
    } catch (e) { /* no-op */ }
  }

  /* An Application Password wins if one was entered; otherwise the login
     cookie is used and the nonce proves the request came from this page. */
  function authHeaders(extra) {
    var h = Object.assign({}, extra || {});
    if (auth.header) h.Authorization = auth.header;
    else if (auth.nonce) h["X-WP-Nonce"] = auth.nonce;
    return h;
  }

  /* Application Passwords are shown with spaces for readability; the API
     wants them without. Strip them so a pasted password just works. */
  function basic(user, pass) {
    return "Basic " + btoa(user.trim() + ":" + pass.replace(/\s+/g, ""));
  }

  function api(path, options) {
    options = options || {};
    options.headers = authHeaders(options.headers);
    options.credentials = "same-origin";
    return fetch(TK.restUrl(path, options.params), options).then(function (res) {
      return res.json().then(
        function (body) {
          if (!res.ok) {
            var err = new Error((body && body.message) || ("Request failed (" + res.status + ")"));
            err.status = res.status;
            err.body = body;
            throw err;
          }
          return body;
        },
        function () {
          if (!res.ok) throw new Error("Request failed (" + res.status + ")");
          return null;
        }
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* Uploads — XHR, because fetch() cannot report progress               */
  /* ------------------------------------------------------------------ */

  function upload(file, onProgress) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", TK.restUrl("wp/v2/media"), true);
      xhr.withCredentials = true;
      if (auth.header) xhr.setRequestHeader("Authorization", auth.header);
      else if (auth.nonce) xhr.setRequestHeader("X-WP-Nonce", auth.nonce);
      xhr.setRequestHeader("Content-Disposition",
        'attachment; filename="' + file.name.replace(/["\\]/g, "") + '"');
      xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");

      xhr.upload.onprogress = function (ev) {
        if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
      };
      xhr.onload = function () {
        var body = null;
        try { body = JSON.parse(xhr.responseText); } catch (e) { /* non-JSON error page */ }
        if (xhr.status >= 200 && xhr.status < 300 && body) return resolve(body);
        reject(new Error(
          (body && body.message) ||
          (xhr.status === 413
            ? "The server rejected the file as too large. Ask your host to raise the upload limit."
            : "Upload failed (" + xhr.status + ")")
        ));
      };
      xhr.onerror = function () { reject(new Error("Upload failed — check your connection.")); };
      xhr.send(file);
    });
  }

  /* ------------------------------------------------------------------ */
  /* Terms — find an existing one or create it                           */
  /* ------------------------------------------------------------------ */

  var termCache = {};

  function taxonomyPath(kind) {
    if (CONFIG.mode === "cpt") {
      return kind === "type" ? "wp/v2/publication-types"
        : kind === "theme" ? "wp/v2/publication-themes"
        : "wp/v2/tags";
    }
    return kind === "type" ? "wp/v2/categories" : "wp/v2/tags";
  }

  function ensureTerm(kind, name) {
    name = String(name || "").trim();
    if (!name) return Promise.resolve(null);

    var path = taxonomyPath(kind);
    var cacheKey = path + "|" + name.toLowerCase();
    if (termCache[cacheKey]) return Promise.resolve(termCache[cacheKey]);

    return api(path, { params: { search: name, per_page: 100, hide_empty: false } })
      .then(function (list) {
        var hit = (list || []).filter(function (t) {
          return t.name.toLowerCase() === name.toLowerCase();
        })[0];
        if (hit) return hit.id;

        var payload = { name: name };
        /* In posts-mode the document type must be filed *under* the
           publications category, or the public page will not see it. */
        if (kind === "type" && CONFIG.mode === "posts" && TK.parentId) {
          payload.parent = TK.parentId;
        }
        return api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (t) { return t.id; });
      })
      .then(function (id) {
        if (id) termCache[cacheKey] = id;
        return id;
      });
  }

  function ensureTerms(kind, names) {
    return Promise.all(names.map(function (n) { return ensureTerm(kind, n); }))
      .then(function (ids) { return ids.filter(Boolean); });
  }

  /* Reads the page count straight out of the file before uploading, so the
     card can show "24 pages" without anyone typing it. */
  function readPageCount(file) {
    if (!CONFIG.pdfjs || !file.arrayBuffer) return Promise.resolve(0);
    return TK.loadPdfJs()
      .then(function (lib) {
        return file.arrayBuffer().then(function (buf) {
          return lib.getDocument({ data: new Uint8Array(buf) }).promise;
        });
      })
      .then(function (doc) { return doc.numPages; })
      .catch(function () { return 0; });   // never block publishing over this
  }

  function wireDrop(dropId, inputId, kind) {
    var drop = $("#" + dropId), input = $("#" + inputId);
    if (!drop || !input) return;

    drop.addEventListener("click", function () { input.click(); });
    drop.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); input.click(); }
    });
    ["dragenter", "dragover"].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add("is-drag"); });
    });
    ["dragleave", "drop"].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove("is-drag"); });
    });
    drop.addEventListener("drop", function (ev) {
      if (ev.dataTransfer.files && ev.dataTransfer.files[0]) accept(ev.dataTransfer.files[0]);
    });
    input.addEventListener("change", function () { if (input.files[0]) accept(input.files[0]); });

    function accept(file) {
      if (kind === "pdf") {
        if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) {
          return toast("That is not a PDF file.", "err");
        }
        if (file.size > MAX_PDF) {
          return toast("That PDF is " + bytes(file.size) + ". The limit is " +
            Math.round(MAX_PDF / 1048576) + " MB — try compressing it.", "err");
        }
        chosen.pdf = file;
        chosen.pdfPages = 0;
        $("#tkpub-pdf-chosen").innerHTML = chosenFileMarkup(file, "pdf");
        clearError("tkpub-pdf-drop");
        readPageCount(file).then(function (pages) {
          chosen.pdfPages = pages;
          var note = $("#tkpub-pdf-chosen [data-file-note]");
          if (note && pages) note.textContent = bytes(file.size) + " · " + pages + " pages";
        });
      } else {
        if (!/^image\//.test(file.type)) return toast("Choose an image file for the cover.", "err");
        if (file.size > MAX_IMG) {
          return toast("That image is " + bytes(file.size) + ". Keep covers under " +
            Math.round(MAX_IMG / 1048576) + " MB.", "err");
        }
        chosen.cover = file;
        var url = URL.createObjectURL(file);
        $("#tkpub-cover-chosen").innerHTML = chosenFileMarkup(file, "cover", url);
      }
    }
  }
