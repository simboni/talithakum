<style>
/* ==========================================================================
   Talitha Kum RAHT Kenya — Publications repository
   Design system + components. Everything is scoped under .tkpub so it cannot
   leak into the Elementor theme, and the theme cannot easily leak in.

   To rebrand, change the custom properties in the :root-scoped block below.
   Nothing else in this file hard-codes a colour.
   ========================================================================== */

.tkpub {
  /* --- Brand -------------------------------------------------------------
     Taken from the live BigHearts theme settings so this page matches the
     rest of talithakumraht.org. If the theme colours are ever changed in
     Elementor, change these eight values and everything follows.
     ---------------------------------------------------------------------- */
  --tk-accent: #F74F22;        /* theme primary  — buttons, active states */
  --tk-accent-dark: #d93d13;   /* hover/pressed */
  --tk-accent-soft: #fdeae3;   /* tinted backgrounds */
  --tk-gold: #FFAC00;          /* theme secondary — highlights, featured */
  --tk-gold-soft: #fff4dc;
  --tk-deep: #232323;          /* theme heading colour */
  --tk-alert: #d0342c;         /* destructive only */

  /* --- Neutrals --------------------------------------------------------- */
  --tk-ink: #232323;
  --tk-body: #616161;          /* theme content colour */
  --tk-muted: #8c8c8c;
  --tk-line: #e7e4e1;
  --tk-line-soft: #f4f1ee;
  --tk-surface: #ffffff;
  --tk-canvas: #faf8f6;

  /* --- Scale ------------------------------------------------------------ */
  --tk-radius: 10px;           /* BigHearts card radius */
  --tk-radius-sm: 8px;
  --tk-radius-pill: 28px;      /* BigHearts button radius */
  --tk-gap: 22px;
  --tk-shadow: 11px 10px 38px 0 rgba(0, 0, 0, .1);   /* the theme's card shadow */
  --tk-shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .35);

  /* --- Type -------------------------------------------------------------
     The theme already loads Nunito Sans, Quicksand and Amatic SC, so these
     cost nothing extra. The stacks fall back gracefully if it ever stops.
     ---------------------------------------------------------------------- */
  --tk-font: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --tk-head-font: "Quicksand", "Nunito Sans", -apple-system, "Segoe UI", sans-serif;

  font-family: var(--tk-font);
  color: var(--tk-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* Headings follow the theme: Quicksand 700, #232323. */
.tkpub h1, .tkpub h2, .tkpub h3, .tkpub h4,
.tkpub .tkpub-title, .tkpub .tkpub-card h3 {
  font-family: var(--tk-head-font);
  font-weight: 700;
  color: var(--tk-deep);
}

/* Reset only inside our scope — Elementor themes vary wildly. */
.tkpub *,
.tkpub *::before,
.tkpub *::after { box-sizing: border-box; }

.tkpub h1, .tkpub h2, .tkpub h3, .tkpub h4, .tkpub p,
.tkpub ul, .tkpub ol, .tkpub figure { margin: 0; padding: 0; }
.tkpub ul, .tkpub ol { list-style: none; }
.tkpub img { max-width: 100%; display: block; }
.tkpub button { font: inherit; color: inherit; cursor: pointer; }

.tkpub :focus-visible {
  outline: 3px solid var(--tk-gold);
  outline-offset: 2px;
  border-radius: 4px;
}

.tkpub-sr {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ==========================================================================
   Header
   ========================================================================== */

.tkpub-head { margin-bottom: 26px; }

.tkpub-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tk-accent);
  background: var(--tk-accent-soft);
  padding: 6px 12px;
  border-radius: var(--tk-radius-pill);
  margin-bottom: 14px;
}

.tkpub-title {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.15;
  font-weight: 800;
  color: var(--tk-deep);
  letter-spacing: -.02em;
}

.tkpub-lede {
  margin-top: 10px;
  max-width: 62ch;
  font-size: 17px;
  color: var(--tk-body);
}

/* ==========================================================================
   Toolbar — search, facets, sort, view switch
   ========================================================================== */

.tkpub-toolbar {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 16px;
  box-shadow: var(--tk-shadow);
  margin-bottom: 22px;
  position: sticky;
  top: 0;
  z-index: 20;
}
/* Themes with a fixed header can set --tk-sticky-offset on .tkpub */
.tkpub[style*="--tk-sticky-offset"] .tkpub-toolbar { top: var(--tk-sticky-offset); }

.tkpub-toolbar-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.tkpub-search {
  position: relative;
  flex: 1 1 260px;
  min-width: 0;
}
.tkpub-search svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--tk-muted); pointer-events: none;
}
.tkpub-search input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tk-ink);
  background: var(--tk-canvas);
  border: 1px solid var(--tk-line);

  padding: 11px 38px 11px 40px;
  transition: border-color .15s, background .15s;
}
.tkpub-search input::placeholder { color: var(--tk-muted); }
.tkpub-search input:focus {
  background: var(--tk-surface);
  border-color: var(--tk-accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--tk-accent-soft);
}
.tkpub-search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: 0; background: none; color: var(--tk-muted);
  width: 26px; height: 26px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
}
.tkpub-search-clear:hover { background: var(--tk-line-soft); color: var(--tk-ink); }
.tkpub-search.is-filled .tkpub-search-clear { display: flex; }

.tkpub-select {
  font: inherit; font-size: 14px;
  color: var(--tk-ink);
  background: var(--tk-canvas)
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%238c8c8c' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5'/%3E%3C/svg%3E")
    no-repeat right 10px center / 15px;
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 11px 32px 11px 12px;
  appearance: none;
  cursor: pointer;
}
.tkpub-select:focus { border-color: var(--tk-accent); outline: none; box-shadow: 0 0 0 3px var(--tk-accent-soft); }

.tkpub-views {
  display: flex; gap: 2px;
  background: var(--tk-canvas);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 3px;
  margin-left: auto;
}
.tkpub-views button {
  border: 0; background: none; color: var(--tk-muted);
  width: 34px; height: 32px; border-radius: 6px;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.tkpub-views button svg { width: 17px; height: 17px; }
.tkpub-views button[aria-pressed="true"] {
  background: var(--tk-surface); color: var(--tk-deep);
  box-shadow: 0 1px 2px rgba(0,0,0,.10);
}

/* Facet chips */
.tkpub-facets {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--tk-line-soft);
}
.tkpub-facet-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--tk-muted);
  align-self: center;
  margin-right: 2px;
}
.tkpub-chip {
  border: 1px solid var(--tk-line);
  background: var(--tk-surface);
  color: var(--tk-body);
  font-size: 13.5px;
  padding: 7px 14px;
  border-radius: var(--tk-radius-pill);
  transition: all .15s;
  display: inline-flex; align-items: center; gap: 7px;
}
.tkpub-chip:hover { border-color: var(--tk-accent); color: var(--tk-accent); }
.tkpub-chip[aria-pressed="true"] {
  background: var(--tk-accent); border-color: var(--tk-accent); color: #fff;
  font-weight: 600;
}
.tkpub-chip-count {
  font-size: 11.5px;
  background: var(--tk-line-soft);
  color: var(--tk-muted);
  padding: 1px 6px; border-radius: var(--tk-radius-pill);
  font-weight: 600;
}
.tkpub-chip[aria-pressed="true"] .tkpub-chip-count { background: rgba(255,255,255,.22); color: #fff; }

.tkpub-reset {
  border: 0; background: none;
  color: var(--tk-alert); font-size: 13.5px; font-weight: 600;
  padding: 7px 4px; text-decoration: underline; text-underline-offset: 3px;
}

.tkpub-resultbar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 14px; color: var(--tk-muted);
}
.tkpub-resultbar strong { color: var(--tk-deep); font-weight: 700; }

/* ==========================================================================
   Featured publication
   ========================================================================== */

.tkpub-featured {
  display: grid;
  grid-template-columns: 210px 1fr;
  gap: 26px;
  background: linear-gradient(125deg, var(--tk-accent) 0%, #fb8518 55%, var(--tk-gold) 100%);
  border-radius: var(--tk-radius);
  padding: 26px;
  margin-bottom: 26px;
  color: #fff;
  box-shadow: var(--tk-shadow);
}
.tkpub-featured .tkpub-cover { box-shadow: var(--tk-shadow-lg); }
.tkpub-featured-body { display: flex; flex-direction: column; align-items: flex-start; }
.tkpub-featured h3 {
  font-size: clamp(20px, 2.4vw, 27px);
  line-height: 1.25; font-weight: 800; color: #fff;
  margin: 10px 0 8px;
  letter-spacing: -.01em;
}
.tkpub-featured p { color: rgba(255,255,255,.82); font-size: 15px; max-width: 60ch; }
.tkpub-featured .tkpub-meta { color: rgba(255,255,255,.7); }
.tkpub-featured .tkpub-meta svg { color: rgba(255,255,255,.55); }
.tkpub-featured .tkpub-actions { margin-top: auto; padding-top: 18px; }
/* On the warm gradient an orange button would disappear — invert it. */
.tkpub-featured .tkpub-btn-primary {
  background: #fff; border-color: #fff; color: var(--tk-accent);
}
.tkpub-featured .tkpub-btn-primary:hover {
  background: var(--tk-deep); border-color: var(--tk-deep); color: #fff;
}
.tkpub-featured .tkpub-btn-ghost {
  border-color: rgba(255,255,255,.55); color: #fff; background: transparent;
}
.tkpub-featured .tkpub-btn-ghost:hover { background: rgba(255,255,255,.16); border-color: #fff; }

.tkpub-flag {
  display: inline-flex; align-items: center; gap: 7px;
  background: #fff; color: var(--tk-accent);
  font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  padding: 5px 11px; border-radius: var(--tk-radius-pill);
}
.tkpub-flag svg { width: 13px; height: 13px; }

/* ==========================================================================
   Grid + cards
   ========================================================================== */

.tkpub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
  gap: var(--tk-gap);
}

.tkpub-card {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 18px;
  display: flex; flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tkpub-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--tk-shadow);
  border-color: var(--tk-accent-soft);
}

/* Cover — real image, or a generated document-looking placeholder */
.tkpub-cover {
  position: relative;
  /* Document covers are portrait, but a full 3:4 makes the grid very tall.
     4:5 keeps the shelf compact; anchoring to the top keeps the cover's
     own title visible when it is cropped. */
  aspect-ratio: var(--tk-cover-ratio, 4 / 5);
  border-radius: var(--tk-radius-sm);
  overflow: hidden;
  background: var(--tk-canvas);
  flex-shrink: 0;
}
.tkpub-cover img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.tkpub-cover-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 16px;
  background: linear-gradient(150deg, var(--tk-c1, #12776f), var(--tk-c2, #0b3c49));
  color: #fff;
}
.tkpub-cover-fallback .tkpub-cf-type {
  font-size: 10.5px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
  opacity: .8;
}
.tkpub-cover-fallback .tkpub-cf-title {
  font-size: 15px; font-weight: 700; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  line-clamp: 4; overflow: hidden;
}
.tkpub-cover-fallback .tkpub-cf-mark {
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; opacity: .65;
}
.tkpub-cover-badge {
  position: absolute; right: 9px; top: 9px;
  background: rgba(35,35,35,.86);
  color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
  padding: 4px 8px; border-radius: 5px;
  backdrop-filter: blur(4px);
}

.tkpub-card .tkpub-cover { margin-bottom: 15px; }

.tkpub-type {
  font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tk-accent);
}

.tkpub-card h3 {
  font-size: 17px; line-height: 1.34; font-weight: 700; color: var(--tk-deep);
  margin: 7px 0 8px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  line-clamp: 3; overflow: hidden;
}

.tkpub-summary {
  font-size: 14px; color: var(--tk-body);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  line-clamp: 3; overflow: hidden;
}

.tkpub-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  margin-top: 13px;
  font-size: 12.5px; color: var(--tk-muted);
}
.tkpub-meta span { display: inline-flex; align-items: center; gap: 5px; }
.tkpub-meta svg { width: 14px; height: 14px; color: var(--tk-line); flex-shrink: 0; }
.tkpub-meta svg { color: #9fb0b1; }

.tkpub-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tkpub-tag {
  font-size: 11.5px; font-weight: 600;
  color: var(--tk-accent-dark); background: var(--tk-accent-soft);
  padding: 3px 9px; border-radius: var(--tk-radius-pill);
  border: 0;
}
.tkpub-tag:hover { background: var(--tk-accent); color: #fff; }

.tkpub-actions {
  display: flex; gap: 9px; flex-wrap: wrap;
  margin-top: auto; padding-top: 16px;
}

/* Buttons mirror the theme's: Quicksand 700, 14px, uppercase, pill. */
.tkpub-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--tk-head-font);
  font-size: 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .01em;
  border-radius: var(--tk-radius-pill);
  padding: 11px 22px;
  border: 2px solid transparent;
  text-decoration: none;
  transition: background .18s, border-color .18s, color .18s;
  white-space: nowrap;
}
.tkpub-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.tkpub-btn-primary { background: var(--tk-accent); border-color: var(--tk-accent); color: #fff; }
/* The theme flips primary buttons to the secondary colour on hover. */
.tkpub-btn-primary:hover { background: var(--tk-gold); border-color: var(--tk-gold); color: #fff; }
.tkpub-btn-ghost { background: transparent; border-color: var(--tk-line); color: var(--tk-body); }
.tkpub-btn-ghost:hover { border-color: var(--tk-accent); color: var(--tk-accent); }
.tkpub-btn-sm { padding: 8px 16px; font-size: 12.5px; }
.tkpub-btn[disabled] { opacity: .55; pointer-events: none; }

/* List view */
.tkpub-grid.is-list { grid-template-columns: 1fr; gap: 14px; }
.tkpub-grid.is-list .tkpub-card {
  display: grid;
  grid-template-columns: 84px 1fr auto;
  grid-template-areas: "cover body actions";
  align-items: center;
  gap: 20px;
  padding: 16px 18px;
}
.tkpub-grid.is-list .tkpub-card:hover { transform: none; }
.tkpub-grid.is-list .tkpub-cover { grid-area: cover; margin: 0; }
.tkpub-grid.is-list .tkpub-card-body { grid-area: body; min-width: 0; }
.tkpub-grid.is-list .tkpub-actions { grid-area: actions; margin: 0; padding: 0; }
.tkpub-grid.is-list .tkpub-summary { -webkit-line-clamp: 2; line-clamp: 2; }
.tkpub-grid.is-list .tkpub-card h3 { -webkit-line-clamp: 2; line-clamp: 2; font-size: 16px; }
.tkpub-grid.is-list .tkpub-tags { display: none; }
.tkpub-grid.is-list .tkpub-cover-fallback { padding: 8px; }
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-title,
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-mark { display: none; }
.tkpub-grid.is-list .tkpub-cover-fallback .tkpub-cf-type { font-size: 9px; }
.tkpub-grid.is-list .tkpub-cover-badge { display: none; }

/* ==========================================================================
   States — loading, empty, error
   ========================================================================== */

.tkpub-skeleton {
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius);
  padding: 18px;
}
.tkpub-sk-line, .tkpub-sk-box {
  background: linear-gradient(90deg, var(--tk-line-soft) 25%, #e3ebeb 37%, var(--tk-line-soft) 63%);
  background-size: 400% 100%;
  animation: tkpub-shimmer 1.4s ease infinite;
  border-radius: 5px;
}
.tkpub-sk-box { aspect-ratio: 3/4; border-radius: var(--tk-radius-sm); margin-bottom: 15px; }
.tkpub-sk-line { height: 11px; margin-bottom: 9px; }
@keyframes tkpub-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) {
  .tkpub-sk-line, .tkpub-sk-box { animation: none; }
  .tkpub-card { transition: none; }
}

.tkpub-state {
  text-align: center;
  padding: 56px 24px;
  background: var(--tk-surface);
  border: 1px dashed var(--tk-line);
  border-radius: var(--tk-radius);
}
.tkpub-state svg { width: 40px; height: 40px; color: var(--tk-line); margin: 0 auto 14px; }
.tkpub-state h3 { font-size: 18px; font-weight: 700; color: var(--tk-deep); margin-bottom: 6px; }
.tkpub-state p { font-size: 14.5px; color: var(--tk-muted); max-width: 46ch; margin: 0 auto 16px; }
.tkpub-state.is-error { border-color: #f0c8c4; background: #fdf6f5; }
.tkpub-state.is-error svg { color: var(--tk-alert); }

.tkpub-more { display: flex; justify-content: center; margin-top: 30px; }

/* ==========================================================================
   PDF viewer modal
   ========================================================================== */

/* The reader sits above everything, including a theme's floating widgets.
   z-index is deliberately near the maximum: BigHearts' back-to-top button
   was drawing over the top of it. */
.tkpub-modal {
  position: fixed; inset: 0; z-index: 2147483000;
  display: none;
  background: rgba(28, 24, 22, .82);
  backdrop-filter: blur(3px);
  padding: 22px;
}
.tkpub-modal.is-open { display: flex; align-items: center; justify-content: center; }

/* Locking the body by position:fixed rather than overflow:hidden — iOS
   Safari ignores the latter and happily scrolls the page behind the reader.
   publications.js stores and restores the scroll position around this. */
body.tkpub-locked {
  position: fixed;
  width: 100%;
  overflow: hidden;
}
/* Floating theme widgets would otherwise punch through the reader. */
body.tkpub-locked [class*="back-to-top"],
body.tkpub-locked [id*="back-to-top"],
body.tkpub-locked [class*="backtotop"] { display: none !important; }

.tkpub-modal-panel {
  background: var(--tk-surface);
  border-radius: var(--tk-radius);
  width: min(1080px, 100%);
  height: min(92vh, 100%);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: var(--tk-shadow-lg);
  animation: tkpub-rise .22s ease;
}
@keyframes tkpub-rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@media (prefers-reduced-motion: reduce) { .tkpub-modal-panel { animation: none; } }

/* --- Title bar -----------------------------------------------------------
   Three fixed columns. The title can only ever be one line plus one line of
   meta, so the bar has a predictable height and cannot collapse into a
   column of single words when the title is long.
   ------------------------------------------------------------------------ */
.tkpub-modal-bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--tk-line);
  background: var(--tk-canvas);
  flex-shrink: 0;
}
.tkpub-modal-titles { min-width: 0; }
.tkpub-modal-titles h2 {
  font-size: 15px; font-weight: 700; color: var(--tk-deep); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tkpub-modal-titles p {
  font-size: 12px; color: var(--tk-muted); line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.tkpub-icbtn {
  border: 1px solid transparent; background: none; color: var(--tk-body);
  min-width: 40px; height: 40px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 0 8px;
  text-decoration: none;
  transition: background .15s, color .15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.tkpub-icbtn svg { width: 18px; height: 18px; flex-shrink: 0; }
.tkpub-icbtn:hover { background: var(--tk-line-soft); color: var(--tk-deep); }
.tkpub-icbtn[disabled] { opacity: .32; pointer-events: none; }
.tkpub-icbtn.is-close:hover { background: #fbe9e7; color: var(--tk-alert); }
.tkpub-icbtn > span {
  font-family: var(--tk-head-font);
  font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em;
}

/* --- Stage ---------------------------------------------------------------
   One continuous scroll of pages. overscroll-behavior stops a flick at the
   end of the document from scrolling the page underneath.
   ------------------------------------------------------------------------ */
.tkpub-modal-stage {
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  background: #4a4442;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
  /* The pinch handler manages zoom itself; letting the browser also
     double-tap-zoom the page makes both fight. */
  touch-action: pan-x pan-y;
}
.tkpub-modal-stage:not(.is-doc) {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

.tkpub-pages {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px;
  min-width: min-content;
  margin: 0 auto;
}
.tkpub-pg {
  position: relative;
  width: 100%;
  background: #fff;
  border-radius: 2px;
  box-shadow: 0 6px 22px rgba(0,0,0,.34);
  flex-shrink: 0;
  overflow: hidden;
}
/* A faint sheet colour until the canvas lands, so scrolling ahead shows
   pages rather than holes. */
.tkpub-pg::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #fff, #f3efec);
  transition: opacity .18s;
}
.tkpub-pg.is-ready::after { opacity: 0; }
.tkpub-pg canvas { display: block; width: 100%; height: auto; position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .tkpub-pg::after { transition: none; } }

.tkpub-modal-stage iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 4px; }
.tkpub-modal-stage.is-frame { padding: 0; display: block; }

.tkpub-viewer-msg {
  color: #fff; text-align: center; padding: 40px 24px; margin: auto;
  max-width: 40ch;
}
.tkpub-viewer-msg h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: #fff; }
.tkpub-viewer-msg p { font-size: 14px; color: rgba(255,255,255,.78); margin-bottom: 18px; }
.tkpub-viewer-msg .tkpub-btn-ghost { border-color: rgba(255,255,255,.4); color: #fff; }

.tkpub-spinner {
  width: 30px; height: 30px; margin: 0 auto 16px;
  border: 3px solid rgba(255,255,255,.28);
  border-top-color: #fff;
  border-radius: 50%;
  animation: tkpub-spin .8s linear infinite;
}
@keyframes tkpub-spin { to { transform: rotate(360deg); } }

/* --- Control bar --------------------------------------------------------- */

.tkpub-modal-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 12px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--tk-line);
  background: var(--tk-canvas);
  flex-shrink: 0;
}
/* Paging and zoom are meaningless until a document has actually rendered. */
.tkpub-modal:not(.has-controls) .tkpub-pager,
.tkpub-modal:not(.has-controls) .tkpub-zoomgroup { visibility: hidden; }

.tkpub-pager, .tkpub-zoomgroup {
  display: flex; align-items: center; gap: 2px;
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-radius: 10px;
  padding: 2px;
  flex-shrink: 0;
}
.tkpub-pager input {
  width: 40px; text-align: center; font: inherit; font-size: 16px;
  border: 0; background: none; color: var(--tk-ink);
  padding: 6px 2px;
}
.tkpub-pager input:focus { outline: none; background: var(--tk-line-soft); border-radius: 5px; }
.tkpub-pager .tkpub-pagecount {
  font-size: 13px; color: var(--tk-muted); padding-right: 8px; white-space: nowrap;
}
.tkpub-zoomlevel {
  font-size: 13px; color: var(--tk-muted); min-width: 46px; text-align: center;
  font-variant-numeric: tabular-nums;
}

.tkpub-modal-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.tkpub-modal-actions .is-wide { white-space: nowrap; }

/* ==========================================================================
   Toasts
   ========================================================================== */

.tkpub-toasts {
  position: fixed; z-index: 100001;
  right: 18px; bottom: 18px;
  display: flex; flex-direction: column; gap: 9px;
  pointer-events: none;
}
.tkpub-toast {
  background: var(--tk-deep); color: #fff;
  font-size: 14px; font-weight: 500;
  padding: 12px 16px; border-radius: var(--tk-radius-sm);
  box-shadow: var(--tk-shadow-lg);
  display: flex; align-items: center; gap: 10px;
  max-width: 340px;
  animation: tkpub-toast-in .2s ease;
  pointer-events: auto;
}
.tkpub-toast svg { width: 17px; height: 17px; flex-shrink: 0; }
.tkpub-toast.is-ok { background: var(--tk-accent-dark); }
.tkpub-toast.is-err { background: var(--tk-alert); }
@keyframes tkpub-toast-in { from { opacity: 0; transform: translateY(10px); } }

/* ==========================================================================
   Admin panel
   ========================================================================== */

.tkpub-admin { display: none; margin-bottom: 26px; }
.tkpub-admin.is-visible { display: block; }

.tkpub-admin-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--tk-deep);
  color: #fff;
  border-radius: var(--tk-radius);
  padding: 13px 18px;
}
.tkpub-admin-bar .tkpub-admin-ico {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,.12);
  display: grid; place-items: center; flex-shrink: 0;
}
.tkpub-admin-bar svg { width: 17px; height: 17px; }
.tkpub-admin-bar h2 { font-size: 15px; font-weight: 700; color: #fff; }
.tkpub-admin-bar p { font-size: 12.5px; color: rgba(255,255,255,.66); }
.tkpub-admin-bar .tkpub-admin-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tkpub-admin-bar .tkpub-btn-ghost { border-color: rgba(255,255,255,.3); color: #fff; }
.tkpub-admin-bar .tkpub-btn-ghost:hover { background: rgba(255,255,255,.1); border-color: #fff; }
.tkpub-admin-bar .tkpub-btn-primary { background: var(--tk-gold); color: #3d2a06; }
.tkpub-admin-bar .tkpub-btn-primary:hover { background: #d9932f; color: #3d2a06; }

.tkpub-who {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: rgba(255,255,255,.8);
  background: rgba(255,255,255,.1);
  padding: 5px 11px; border-radius: var(--tk-radius-pill);
}
.tkpub-who b { color: #fff; font-weight: 700; }

.tkpub-admin-body {
  display: none;
  background: var(--tk-surface);
  border: 1px solid var(--tk-line);
  border-top: 0;
  border-radius: 0 0 var(--tk-radius) var(--tk-radius);
  margin-top: -14px;
  padding: 26px 22px 22px;
}
.tkpub-admin.is-open .tkpub-admin-body { display: block; }
.tkpub-admin.is-open .tkpub-admin-bar { border-radius: var(--tk-radius) var(--tk-radius) 0 0; }

.tkpub-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--tk-line); margin-bottom: 22px; }
.tkpub-tabs button {
  border: 0; background: none; color: var(--tk-muted);
  font-size: 14px; font-weight: 600;
  padding: 10px 15px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tkpub-tabs button[aria-selected="true"] { color: var(--tk-accent); border-bottom-color: var(--tk-accent); }

.tkpub-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.tkpub-field { display: flex; flex-direction: column; gap: 6px; }
.tkpub-field.is-full { grid-column: 1 / -1; }
.tkpub-field label,
.tkpub-field > .tkpub-fieldlabel {
  font-size: 13px; font-weight: 700; color: var(--tk-deep);
  display: flex; align-items: center; gap: 6px;
}
.tkpub-field .tkpub-check span,
.tkpub-field .tkpub-switch .tkpub-hint { font-weight: 400; }
.tkpub-req { color: var(--tk-alert); font-weight: 700; }
.tkpub-hint { font-size: 12.5px; color: var(--tk-muted); }
.tkpub-field input[type="text"],
.tkpub-field input[type="date"],
.tkpub-field input[type="number"],
.tkpub-field input[type="password"],
.tkpub-field select,
.tkpub-field textarea {
  font: inherit; font-size: 14.5px; color: var(--tk-ink);
  background: var(--tk-canvas);
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 10px 12px;
  width: 100%;
  transition: border-color .15s, background .15s;
}
.tkpub-field textarea { min-height: 92px; resize: vertical; line-height: 1.55; }
.tkpub-field input:focus, .tkpub-field select:focus, .tkpub-field textarea:focus {
  background: var(--tk-surface); border-color: var(--tk-accent); outline: none;
  box-shadow: 0 0 0 3px var(--tk-accent-soft);
}
.tkpub-field .tkpub-invalid { border-color: var(--tk-alert); background: #fdf6f5; }
.tkpub-err { font-size: 12.5px; color: var(--tk-alert); font-weight: 600; }
.tkpub-counter { font-size: 12px; color: var(--tk-muted); text-align: right; }
.tkpub-counter.is-over { color: var(--tk-alert); font-weight: 700; }

.tkpub-checks { display: flex; flex-wrap: wrap; gap: 8px; }
.tkpub-check { position: relative; display: inline-block; }
/* Visually hidden rather than zero-sized, so it stays focusable and is still
   announced by screen readers. The <span> is the visible control. */
.tkpub-check input {
  position: absolute; width: 1px; height: 1px;
  margin: 0; padding: 0; border: 0;
  opacity: 0; clip: rect(0 0 0 0); overflow: hidden;
}
.tkpub-check span {
  display: inline-block;
  border: 1px solid var(--tk-line); background: var(--tk-surface);
  color: var(--tk-body); font-size: 13.5px;
  padding: 7px 13px; border-radius: var(--tk-radius-pill);
  cursor: pointer; transition: all .15s;
}
.tkpub-check input:checked + span {
  background: var(--tk-accent-soft); border-color: var(--tk-accent); color: var(--tk-accent-dark); font-weight: 600;
}
.tkpub-check input:focus-visible + span { outline: 3px solid var(--tk-gold); outline-offset: 2px; }

.tkpub-switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.tkpub-switch input { position: absolute; opacity: 0; }
.tkpub-switch .tkpub-track {
  width: 42px; height: 24px; border-radius: 999px;
  background: var(--tk-line); position: relative; transition: background .18s; flex-shrink: 0;
}
.tkpub-switch .tkpub-track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .18s;
}
.tkpub-switch input:checked + .tkpub-track { background: var(--tk-accent); }
.tkpub-switch input:checked + .tkpub-track::after { transform: translateX(18px); }
.tkpub-switch input:focus-visible + .tkpub-track { outline: 3px solid var(--tk-gold); outline-offset: 2px; }

/* Dropzone */
.tkpub-drop {
  border: 2px dashed var(--tk-line);
  border-radius: var(--tk-radius-sm);
  background: var(--tk-canvas);
  padding: 22px 18px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.tkpub-drop:hover, .tkpub-drop.is-drag { border-color: var(--tk-accent); background: var(--tk-accent-soft); }
.tkpub-drop svg { width: 26px; height: 26px; color: var(--tk-muted); margin: 0 auto 8px; }
.tkpub-drop b { color: var(--tk-accent); font-weight: 700; }
.tkpub-drop p { font-size: 13.5px; color: var(--tk-body); }
.tkpub-drop small { font-size: 12px; color: var(--tk-muted); display: block; margin-top: 4px; }
.tkpub-drop input[type="file"] { display: none; }

.tkpub-file {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  background: var(--tk-surface);
  padding: 11px 13px;
}
.tkpub-file-ico {
  width: 36px; height: 36px; border-radius: 7px; flex-shrink: 0;
  background: var(--tk-accent-soft); color: var(--tk-accent-dark);
  display: grid; place-items: center;
}
.tkpub-file-ico svg { width: 18px; height: 18px; }
.tkpub-file-ico.is-img { background: var(--tk-gold-soft); color: #9a6a12; }
.tkpub-file-body { min-width: 0; flex: 1; }
.tkpub-file-body b {
  display: block; font-size: 13.5px; color: var(--tk-deep); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tkpub-file-body span { font-size: 12px; color: var(--tk-muted); }
.tkpub-file img { width: 36px; height: 46px; object-fit: cover; border-radius: 5px; }

.tkpub-progress {
  height: 5px; border-radius: 999px; background: var(--tk-line-soft);
  overflow: hidden; margin-top: 7px;
}
.tkpub-progress i {
  display: block; height: 100%; width: 0;
  background: var(--tk-accent); border-radius: 999px;
  transition: width .2s ease;
}

.tkpub-form-foot {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 22px; padding-top: 18px;
  border-top: 1px solid var(--tk-line-soft);
}
.tkpub-form-foot .tkpub-hint { flex: 1; min-width: 200px; }

/* Manage list */
.tkpub-manage { display: flex; flex-direction: column; gap: 9px; }
.tkpub-row {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center; gap: 14px;
  border: 1px solid var(--tk-line);
  border-radius: var(--tk-radius-sm);
  padding: 11px 13px;
  background: var(--tk-surface);
}
.tkpub-row-body { min-width: 0; }
.tkpub-row-body b {
  display: block; font-size: 14px; font-weight: 600; color: var(--tk-deep);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tkpub-row-body span { font-size: 12.5px; color: var(--tk-muted); }
.tkpub-status {
  font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  padding: 4px 9px; border-radius: var(--tk-radius-pill);
}
.tkpub-status.is-publish { background: var(--tk-accent-soft); color: var(--tk-accent-dark); }
.tkpub-status.is-draft { background: var(--tk-gold-soft); color: #9a6a12; }
.tkpub-row-tools { display: flex; gap: 4px; }

/* Login card */
.tkpub-login { max-width: 460px; }
.tkpub-login .tkpub-field { margin-bottom: 14px; }
.tkpub-callout {
  background: var(--tk-accent-soft);
  border-left: 3px solid var(--tk-accent);
  border-radius: 0 var(--tk-radius-sm) var(--tk-radius-sm) 0;
  padding: 13px 15px;
  font-size: 13.5px; color: var(--tk-accent-dark);
  margin-bottom: 18px;
}
.tkpub-callout b { color: var(--tk-deep); }
.tkpub-callout ol { list-style: decimal; padding-left: 18px; margin-top: 7px; }
.tkpub-callout li { margin-top: 3px; }

/* ==========================================================================
   Responsive
   ========================================================================== */

@media (max-width: 860px) {
  .tkpub-featured { grid-template-columns: 150px 1fr; gap: 18px; padding: 20px; }
  .tkpub-form-grid { grid-template-columns: 1fr; }
  .tkpub-toolbar { position: static; }
}

@media (max-width: 620px) {
  .tkpub-featured { grid-template-columns: 1fr; }
  .tkpub-featured .tkpub-cover { max-width: 150px; }
  .tkpub-grid { grid-template-columns: 1fr; }
  .tkpub-grid.is-list .tkpub-card {
    grid-template-columns: 64px 1fr;
    grid-template-areas: "cover body" "actions actions";
    gap: 14px;
  }
  .tkpub-grid.is-list .tkpub-actions { padding-top: 4px; }
  .tkpub-views { margin-left: 0; }
  .tkpub-admin-bar .tkpub-admin-actions { margin-left: 0; width: 100%; }
  .tkpub-toasts { left: 14px; right: 14px; bottom: 14px; }
  .tkpub-toast { max-width: none; }
}

/* ==========================================================================
   The reader on a phone

   Nearly all readers are on one, so this is the case that has to be right,
   not the fallback. The panel takes the whole screen, the title bar keeps a
   fixed height, and everything that is not paging, zooming or copying a link
   is removed so the three remaining controls can be full-size touch targets.
   ========================================================================== */

@media (max-width: 640px) {
  .tkpub-modal { padding: 0; }

  .tkpub-modal-panel {
    width: 100%; border-radius: 0;
    height: 100vh;
    /* dvh tracks the browser chrome collapsing as you scroll; vh does not,
       and the control bar ends up under the address bar without it. */
    height: 100dvh;
    animation: none;
  }

  .tkpub-modal-bar { padding: 8px 8px 8px 4px; gap: 6px; }
  .tkpub-modal-titles h2 { font-size: 14.5px; }
  .tkpub-modal-titles p { font-size: 11.5px; }

  .tkpub-modal-stage { padding: 8px; }
  .tkpub-pages { gap: 10px; }

  .tkpub-modal-foot { padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }

  /* Download already sits in the title bar, so the labelled button here is
     redundant. Full screen stays: opening the PDF in the phone's own viewer
     is the escape hatch when rendering fails or someone wants to print, and
     it is the one control that cannot be replaced by something else. */
  .tkpub-modal-actions .is-wide,
  .tkpub-zoomlevel { display: none; }
  .tkpub-modal-actions .tkpub-icbtn > span { display: none; }

  /* 44px is the floor for a touch target, so nothing here goes below it —
     the pager gives up width instead. */
  .tkpub-icbtn { min-width: 44px; height: 44px; padding: 0 5px; }
  .tkpub-pager input {
    min-width: 44px; min-height: 44px; width: 44px; padding: 0;
    font-size: 16px;   /* below 16 and iOS zooms the page on focus */
  }
  .tkpub-pager .tkpub-pagecount { padding-right: 5px; font-size: 12.5px; }
  .tkpub-modal-foot { gap: 8px; }
}

@media (max-width: 380px) {
  .tkpub-modal-titles p { display: none; }   /* title alone; every mm counts */
  /* Last two to go, in this order. The link is already in the address bar and
     reachable through the phone's share sheet; the page total is already in
     the title bar meta line. Both are duplicates — the touch targets are not,
     so they keep their full size. */
  .tkpub-modal-actions [data-copy],
  .tkpub-pager .tkpub-pagecount { display: none; }
  .tkpub-icbtn { padding: 0 2px; }
  .tkpub-modal-foot { gap: 6px; }
}

/* A phone held sideways has almost no height to spare — give the document
   all of it and shrink the two bars. */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 480px) {
  .tkpub-modal-bar { padding: 4px 8px; }
  .tkpub-modal-titles p { display: none; }
  .tkpub-modal-foot { padding: 4px 8px; }
  .tkpub-icbtn { height: 38px; min-width: 38px; }
  .tkpub-modal-stage { padding: 6px; }
}

@media print {
  .tkpub-toolbar, .tkpub-admin, .tkpub-actions, .tkpub-modal, .tkpub-toasts { display: none !important; }
}

/* ==========================================================================
   Talitha Kum RAHT Kenya — Publications repository
   MOBILE REFINEMENTS

   This file is appended AFTER publications.css by the build, so on equal
   specificity these rules win. It is a refinement layer, not a rewrite:
   publications.css still owns the design system, the custom properties and
   every desktop decision. Nothing here re-declares a colour — if a brand
   value needs changing, change it once in publications.css.

   Why this file exists at all: roughly 95% of the people who read these
   documents arrive on a phone, usually on a slow connection, usually
   one-handed. The desktop layout is not wrong, it is simply built for a
   different set of constraints — wide viewports, a mouse, and a scrollbar
   that costs nothing. Below 640px the trade-offs invert: vertical space is
   the scarcest resource, every target has to survive a thumb, and any input
   under 16px makes iOS Safari zoom the whole page on focus.

   DELIBERATELY NOT HERE: the document reader. Everything inside
   .tkpub-modal — the pager, zoom controls, stage, spinner, viewer messages
   and .tkpub-icbtn itself — is owned by the viewer work and is tuned
   against real PDF rendering, which this file cannot see. The one exception
   is .tkpub-icbtn where it is *reused* in the admin panel; those rules are
   scoped to an admin ancestor (.tkpub-row-tools, .tkpub-file) and never
   touch the bare class.

   Note on stickiness: publications.css already drops the toolbar out of
   sticky positioning below 860px, and --tk-sticky-offset exists on .tkpub
   for themes with a fixed header. BigHearts has one. We do not fight it —
   see the toolbar section for why static is the right answer on a phone.
   ========================================================================== */


/* ==========================================================================
   PHONES — the main breakpoint
   ========================================================================== */

@media (max-width: 640px) {

  /* ------------------------------------------------------------------------
     Overflow safety.
     A single long title, a pasted URL in a summary or an unbroken Kiswahili
     compound is enough to push the whole page sideways at 320px, and a
     horizontally scrolling page is very hard to recover from on a phone.
     We opt individual text holders into breaking rather than setting it on
     .tkpub wholesale, because `anywhere` also changes min-content sizing and
     would quietly affect how the grid and flex containers measure themselves.
     --------------------------------------------------------------------- */
  .tkpub-title,
  .tkpub-lede,
  .tkpub-card h3,
  .tkpub-summary,
  .tkpub-featured h3,
  .tkpub-featured p,
  .tkpub-state h3,
  .tkpub-state p,
  .tkpub-toast,
  .tkpub-callout,
  .tkpub-hint,
  .tkpub-err,
  .tkpub-cover-fallback .tkpub-cf-title,
  .tkpub-file-body b,
  .tkpub-row-body b { overflow-wrap: anywhere; }

  /* The grid's minmax(288px, 1fr) track is wider than a 320px viewport once
     padding is counted, which is a classic source of sideways scroll. */
  .tkpub-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }

  /* ------------------------------------------------------------------------
     iOS zoom-on-focus.
     Mobile Safari zooms the viewport whenever a focused form control is
     under 16px, and it does not zoom back out. It is the single most common
     mobile bug in pages like this. 16px everywhere, no exceptions.
     The :not(.tkpub-modal) guard matters: the reader's root element carries
     both .tkpub and .tkpub-modal, and its controls belong to the viewer.
     --------------------------------------------------------------------- */
  .tkpub:not(.tkpub-modal) input,
  .tkpub:not(.tkpub-modal) select,
  .tkpub:not(.tkpub-modal) textarea { font-size: 16px; }

  /* ------------------------------------------------------------------------
     Header and lede.
     clamp() already shrinks the title, but the block as a whole is pure
     preamble: on a phone it sits between the reader and the thing they came
     for. Tighten the rhythm and let the lede run to the full column — the
     62ch cap is a line-length rule for wide screens and does nothing here.
     --------------------------------------------------------------------- */
  .tkpub-head { margin-bottom: 18px; }
  .tkpub-eyebrow { font-size: 11px; padding: 5px 11px; margin-bottom: 10px; }
  .tkpub-title { font-size: 27px; line-height: 1.18; }
  .tkpub-lede { font-size: 15.5px; line-height: 1.6; max-width: none; margin-top: 8px; }

  /* ------------------------------------------------------------------------
     Toolbar.
     Two changes. First, it stays static (publications.css already does this
     below 860px and we keep it): a sticky filter bar plus the theme's own
     fixed header would eat a third of a small viewport permanently, and
     filters are a thing you touch once and then scroll past.
     Second, the row becomes an explicit two-up grid instead of a wrapping
     flex row. Wrapping produced ragged half-empty rows whose height changed
     depending on whether the language select was present; a grid gives the
     same height every time. The screen-reader labels are position:absolute
     so they take no grid slot, and the language select is [hidden] on
     single-language libraries so it is skipped by auto-placement.
     --------------------------------------------------------------------- */
  .tkpub-toolbar { padding: 12px; margin-bottom: 16px; }

  .tkpub-toolbar-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    align-items: stretch;
  }

  /* Search is the primary action on a phone — full width, always first. */
  .tkpub-search { grid-column: 1 / -1; }
  .tkpub-search input {
    min-height: 48px;
    padding: 12px 48px 12px 42px;
    border-radius: var(--tk-radius-sm);
  }
  /* 26px was a mouse target. A thumb needs the full 44, and the input's
     right padding above is set to clear it. */
  .tkpub-search-clear {
    width: 44px; height: 44px;
    right: 2px;
    border-radius: 50%;
  }
  .tkpub-search-clear svg { width: 18px; height: 18px; }

  .tkpub-select {
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 12px 34px 12px 12px;
  }
  /* Never let a layout rule resurrect a select the JS deliberately hid. */
  .tkpub-select[hidden] { display: none; }

  /* The view switch gets its own full-width row as a segmented control.
     It reads as one control, and each half comfortably clears 44px instead
     of the 34x32 icon buttons that work fine under a cursor. */
  .tkpub-views {
    grid-column: 1 / -1;
    margin-left: 0;
    padding: 4px;
  }
  .tkpub-views button {
    flex: 1 1 0;
    width: auto;
    min-width: 44px;
    height: 44px;
  }
  .tkpub-views button svg { width: 19px; height: 19px; }

  /* ------------------------------------------------------------------------
     Facet chips.
     Two wrapping rows of chips can be 200px tall on a 360px screen — more
     than the first card. Each facet row becomes a single-line strip that
     scrolls sideways, which is a gesture phone users already have.

     Details that make it not feel broken:
       - the scrollbar is hidden (it would be a permanent grey line here);
       - momentum scrolling is kept on iOS;
       - proximity snapping tidies up the resting position without fighting
         a deliberate flick;
       - a right-edge fade signals there is more, and the trailing padding
         means that fade lands on empty space once you reach the end rather
         than permanently dimming the last chip;
       - the facet label pins to the left so you never lose track of which
         axis you are filtering on;
       - vertical padding leaves room for the focus ring, which an
         overflow-x container would otherwise clip.
     --------------------------------------------------------------------- */
  .tkpub-facets {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    /* Keeps a snapped or keyboard-focused chip clear of the pinned label. */
    scroll-padding-inline: 62px 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    gap: 7px;
    margin-top: 10px;
    padding: 8px 30px 4px 0;
    /* Fade the right edge so it is obvious the strip continues. */
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
  }
  .tkpub-facets::-webkit-scrollbar { display: none; }

  .tkpub-facet-label {
    position: sticky;
    left: 0;
    z-index: 1;
    flex: 0 0 auto;
    align-self: stretch;
    display: flex;
    align-items: center;
    background: var(--tk-surface);
    padding-right: 8px;
  }

  .tkpub-chip {
    flex: 0 0 auto;
    scroll-snap-align: start;
    min-height: 44px;
    padding: 0 15px;
    font-size: 14px;
    white-space: nowrap;
  }
  .tkpub-chip-count { font-size: 12px; }

  /* The reset is the escape hatch from a bad filter combination, so it must
     not be the one thing hiding off the right edge. It pins to the trailing
     edge instead, and the row that contains it drops the fade so the button
     is never rendered half-transparent. Visual order still matches DOM
     order — it is the last item either way. */
  .tkpub-facets:has(.tkpub-reset) {
    padding-right: 0;
    -webkit-mask-image: none;
    mask-image: none;
  }
  .tkpub-facets .tkpub-reset {
    position: sticky;
    right: 0;
    z-index: 1;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 2px 0 18px;
    background: linear-gradient(to right, transparent, var(--tk-surface) 16px);
  }

  .tkpub-resultbar { margin-bottom: 12px; font-size: 13.5px; }

  /* ------------------------------------------------------------------------
     Cards.
     A full-width 4:5 cover on a 360px screen is around 430px tall, so a
     single card fills the viewport and the library stops looking like a
     library. The grid card adopts the same shape the list view already
     uses: a small cover on the left, text on the right, actions across the
     bottom. You can see three or four publications at once, which is what
     makes browsing possible.

     3:4 rather than the default 4:5 because at 96px wide the cover is now a
     thumbnail, and the taller ratio reads more like a document spine.
     --------------------------------------------------------------------- */
  .tkpub-grid:not(.is-list) .tkpub-card {
    --tk-cover-ratio: 3 / 4;
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr);
    grid-template-areas:
      "cover body"
      "actions actions";
    align-items: start;
    gap: 4px 14px;
    padding: 14px;
  }
  .tkpub-grid:not(.is-list) .tkpub-card > .tkpub-cover {
    grid-area: cover;
    margin-bottom: 0;
  }
  .tkpub-grid:not(.is-list) .tkpub-card-body { grid-area: body; min-width: 0; }
  .tkpub-grid:not(.is-list) .tkpub-actions { grid-area: actions; }

  .tkpub-card h3 { font-size: 16px; margin: 5px 0 6px; }
  .tkpub-summary { font-size: 13.5px; -webkit-line-clamp: 3; line-clamp: 3; }
  .tkpub-meta { margin-top: 9px; gap: 4px 12px; font-size: 12px; }

  /* The generated cover is typeset for a 288px card. At thumbnail size the
     org mark is unreadable and just adds noise, so only the type label and
     a short title survive. */
  .tkpub-cover-fallback { padding: 9px; }
  .tkpub-cover-fallback .tkpub-cf-title {
    font-size: 12px;
    -webkit-line-clamp: 3;
    line-clamp: 3;
  }
  .tkpub-cover-fallback .tkpub-cf-mark { display: none; }
  /* The page-count badge and the type label both live in the top corners of
     the cover. At 84-96px wide there are no longer two corners and they
     print on top of each other. The count is already in the meta row as
     "24 pages", so the badge is the one to lose — same call the list view
     makes for the same reason. */
  .tkpub-cover-badge { display: none; }

  /* Theme tags double as filters, so they are real targets, not decoration.
     min-height rather than padding alone keeps the pill's own text centred.
     Full-size pills wrap to two or three rows inside a 214px text column,
     which put about 50px of chrome on every card, so the row scrolls
     sideways like the facet strips rather than growing downwards. */
  .tkpub-tags {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    gap: 6px;
    margin-top: 6px;
    /* Room for the focus ring, which an overflow container would clip. */
    padding: 4px 0;
  }
  .tkpub-tags::-webkit-scrollbar { display: none; }
  .tkpub-tag {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 13px;
    font-size: 12.5px;
    white-space: nowrap;
  }

  /* Two actions, side by side, equal width, never wrapping into a stub.
     Equal widths also mean the primary action lands under the thumb in the
     same place on every card. */
  .tkpub-actions {
    flex-wrap: nowrap;
    gap: 8px;
    padding-top: 12px;
  }
  .tkpub-actions .tkpub-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 46px;
    padding-inline: 12px;
  }
  /* The uppercase button label is what overflows first at 320px; letting it
     shrink is better than letting the row break. */
  .tkpub-btn { font-size: 13px; }
  .tkpub-btn-sm { font-size: 12.5px; min-height: 44px; }

  /* List view already has the right shape — it only needs the touch sizes,
     which the .tkpub-actions rules above supply. Cover ratio matched to the
     grid card so switching views does not jump the layout. */
  .tkpub-grid.is-list .tkpub-card { --tk-cover-ratio: 3 / 4; }

  /* ------------------------------------------------------------------------
     Featured block.
     publications.css stacks it below 620px, which makes the tallest, most
     colourful thing on the page even taller. Same horizontal treatment as
     the cards instead — it stays visually distinct through the gradient and
     the flag, not through sheer size.
     --------------------------------------------------------------------- */
  .tkpub-featured {
    grid-template-columns: 104px minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .tkpub-featured .tkpub-cover { max-width: none; width: 100%; --tk-cover-ratio: 3 / 4; }
  .tkpub-featured h3 { font-size: 19px; margin: 8px 0 6px; }
  .tkpub-featured p {
    font-size: 14px;
    max-width: none;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    line-clamp: 4;
    overflow: hidden;
  }
  .tkpub-flag { font-size: 10.5px; padding: 5px 10px; }
  /* The body is a flex column with align-items:flex-start, so the action row
     has to be told to fill the column before its buttons can share it. */
  .tkpub-featured .tkpub-actions {
    align-self: stretch;
    width: 100%;
    padding-top: 14px;
  }

  /* ------------------------------------------------------------------------
     Empty, error and load-more.
     56px of vertical padding around an empty state is generous framing on a
     desktop and wasted scrolling on a phone. The load-more button goes full
     width: it is the only control in its region, it is at the end of a long
     scroll, and a centred pill is a small target to hit one-handed.
     --------------------------------------------------------------------- */
  .tkpub-state { padding: 32px 18px; }
  .tkpub-state svg { width: 34px; height: 34px; margin-bottom: 10px; }
  .tkpub-state h3 { font-size: 16.5px; }
  .tkpub-state p { font-size: 14px; max-width: none; }

  .tkpub-more { margin-top: 22px; }
  .tkpub-more .tkpub-btn { width: 100%; min-height: 50px; }

  /* ------------------------------------------------------------------------
     Toasts.
     Full-bleed at the bottom (publications.css does this at 620px) sits
     right where the home indicator and browser chrome are, so respect the
     safe area. When the publishing form's sticky footer is on screen the
     toast is lifted above it — a confirmation that covers the Publish
     button is worse than no confirmation.
     --------------------------------------------------------------------- */
  .tkpub-toasts {
    left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .tkpub-toast { font-size: 14.5px; padding: 13px 15px; }
  body:has(.tkpub-admin.is-open) .tkpub-toasts {
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }

  /* ======================================================================
     Admin panel
     Staff publish from their phones — often standing in front of the person
     whose report they are uploading — so this is not a desktop-only screen.
     ====================================================================== */

  .tkpub-admin { margin-bottom: 18px; }

  /* The bar's icon, heading and actions cannot share one line at 360px
     without the buttons becoming unusable, so the actions take their own
     full-width row and split it. */
  .tkpub-admin-bar { padding: 12px 14px; gap: 10px; }
  .tkpub-admin-bar h2 { font-size: 14.5px; }
  .tkpub-admin-bar p { font-size: 12px; }
  .tkpub-admin-bar .tkpub-admin-actions {
    margin-left: 0;
    width: 100%;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tkpub-admin-bar .tkpub-btn {
    flex: 1 1 auto;
    min-height: 44px;
    justify-content: center;
  }
  .tkpub-who { min-height: 34px; }

  .tkpub-admin-body { padding: 20px 14px 18px; }

  /* Two tabs, so let them split the width — a full-width target each rather
     than two small text links in the corner. Kept scrollable in case a third
     tab is ever added. */
  .tkpub-tabs {
    margin-bottom: 18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tkpub-tabs::-webkit-scrollbar { display: none; }
  .tkpub-tabs button {
    flex: 1 1 auto;
    min-height: 46px;
    padding: 10px 12px;
    font-size: 14.5px;
    white-space: nowrap;
  }

  .tkpub-form-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .tkpub-field textarea { min-height: 110px; }

  /* Theme selection is a set of tappable pills, and a mis-tap here silently
     mis-files a publication. Full 44px height, and enough horizontal padding
     that adjacent pills are not neighbours by a hair. */
  .tkpub-checks { gap: 8px; }
  .tkpub-check span {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    font-size: 14px;
  }

  /* The switch label becomes the target, not just the 42x24 track. The track
     itself is scaled up in step (knob and travel included) because a 24px
     control is hard to read at arm's length. */
  .tkpub-switch { min-height: 44px; gap: 12px; }
  .tkpub-switch .tkpub-track { width: 50px; height: 30px; }
  .tkpub-switch .tkpub-track::after { width: 24px; height: 24px; top: 3px; left: 3px; }
  .tkpub-switch input:checked + .tkpub-track::after { transform: translateX(20px); }

  /* Drop zones cannot be dropped onto from a phone — they are buttons that
     open the file picker. Sized accordingly, and the dashed edge is kept
     because it still reads as "put something here". */
  .tkpub-drop {
    min-height: 108px;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .tkpub-drop svg { width: 24px; height: 24px; margin-bottom: 6px; }
  .tkpub-drop p { font-size: 14px; }
  .tkpub-drop small { font-size: 12px; }

  /* Chosen-file row: the remove control is a real target. Scoped to .tkpub-file
     so it never reaches the reader's own icon buttons. */
  .tkpub-file { min-height: 58px; gap: 10px; padding: 9px 8px 9px 12px; }
  .tkpub-file .tkpub-icbtn { width: 44px; height: 44px; flex-shrink: 0; }

  /* The publishing form is long — a dozen fields, two uploads. On a phone
     the Save and Publish buttons end up several screens below the field you
     are working in, so people abandon halfway or scroll blindly to the
     bottom to check the form is still there. Pinning the footer keeps the
     commit action permanently in reach and doubles as a reminder that
     nothing has been saved yet. The negative margins let it span the full
     panel width so it reads as a bar rather than a floating row.
     The guidance hint is dropped here: it is a paragraph of advice, and a
     sticky bar has room for actions only. See the report — it wants to move
     above the footer in the markup. */
  .tkpub-form-foot {
    position: sticky;
    bottom: 0;
    z-index: 5;
    margin: 20px -14px 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--tk-surface);
    border-top: 1px solid var(--tk-line);
    box-shadow: 0 -8px 18px -12px rgba(0, 0, 0, .45);
    gap: 10px;
    flex-wrap: nowrap;
  }
  .tkpub-form-foot .tkpub-hint { display: none; }
  .tkpub-form-foot .tkpub-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 48px;
    padding-inline: 12px;
  }

  /* Manage list: four columns will not fit, so status and tools drop to a
     second line while the icon keeps its own full-height column. The edit
     and trash buttons are 44px because trash is destructive and a near-miss
     is expensive. */
  .tkpub-row {
    grid-template-columns: 38px minmax(0, 1fr) auto;
    grid-template-areas:
      "ico body tools"
      "ico status tools";
    gap: 4px 10px;
    padding: 10px 8px 10px 12px;
  }
  .tkpub-row > .tkpub-file-ico { grid-area: ico; align-self: start; width: 34px; height: 34px; }
  .tkpub-row-body { grid-area: body; }
  .tkpub-row .tkpub-status { grid-area: status; justify-self: start; }
  .tkpub-row-tools { grid-area: tools; align-self: center; gap: 2px; }
  .tkpub-row-tools .tkpub-icbtn { width: 44px; height: 44px; }

  /* Login: the card cap is a desktop reading-width rule. The callout is the
     only place anyone learns what an Application Password is, so it stays,
     but at a size that does not dominate the form it explains. */
  .tkpub-login { max-width: none; }
  .tkpub-callout { padding: 12px 13px; font-size: 13px; }
  .tkpub-callout ol { padding-left: 20px; }
  #tkpub-login-form > .tkpub-btn { width: 100%; min-height: 48px; }
}


/* ==========================================================================
   SMALL PHONES
   360px is the common floor, but a 320px iPhone SE still turns up in the
   analytics and it is exactly the width where a two-up grid starts
   truncating select labels and buttons lose their icons.
   ========================================================================== */

@media (max-width: 380px) {

  .tkpub-toolbar { padding: 10px; }
  .tkpub-toolbar-row { gap: 8px; }
  /* The two-up grid is kept even here — a stacked row per select would add
     about 60px to a toolbar the reader has to scroll past every time. What
     gives instead is the select's own padding, which buys back roughly a
     character and a half of visible label at 16px. */
  .tkpub-select { padding-left: 10px; padding-right: 28px; background-position: right 8px center; }

  .tkpub-title { font-size: 24px; }
  .tkpub-lede { font-size: 15px; }

  /* Cover shrinks before the text column does — the title and summary are
     what people actually scan. */
  .tkpub-grid:not(.is-list) .tkpub-card { grid-template-columns: 84px minmax(0, 1fr); gap: 4px 12px; padding: 12px; }
  .tkpub-featured { grid-template-columns: 88px minmax(0, 1fr); gap: 14px; padding: 14px; }

  /* Below this width the two action buttons cannot hold icon plus label
     side by side. The labels carry the meaning, so the icons go. */
  .tkpub-actions .tkpub-btn svg { display: none; }
  .tkpub-actions .tkpub-btn { font-size: 12.5px; padding-inline: 8px; }

  .tkpub-form-foot .tkpub-btn { font-size: 12.5px; }
}


/* ==========================================================================
   TOUCH DEVICES
   Width is a proxy for touch, and a poor one — an iPad in landscape is
   1024px wide and still has no cursor. These rules key off the input device
   itself, which is the honest condition for anything about fingers.
   ========================================================================== */

@media (hover: none) and (pointer: coarse) {

  /* Repeated from the phone block on purpose: tablets zoom on sub-16px
     inputs exactly like phones do, and they never match max-width 640. */
  .tkpub:not(.tkpub-modal) input,
  .tkpub:not(.tkpub-modal) select,
  .tkpub:not(.tkpub-modal) textarea { font-size: 16px; }

  /* :hover on a touch device is applied on tap and then sticks until you
     tap elsewhere, so hover states read as broken selection states. Cards
     lose the lift, and interactive elements get a pressed state instead —
     feedback at the moment of the tap, which is when it is useful. */
  .tkpub-card:hover {
    transform: none;
    box-shadow: none;
    border-color: var(--tk-line);
  }
  .tkpub-chip:hover { border-color: var(--tk-line); color: var(--tk-body); }
  .tkpub-chip[aria-pressed="true"]:hover { border-color: var(--tk-accent); color: #fff; }
  .tkpub-tag:hover { background: var(--tk-accent-soft); color: var(--tk-accent-dark); }
  .tkpub-drop:hover { border-color: var(--tk-line); background: var(--tk-canvas); }
  .tkpub-search-clear:hover { background: none; color: var(--tk-muted); }

  .tkpub-chip:active { transform: scale(.97); }
  .tkpub-tag:active { background: var(--tk-accent); color: #fff; }
  .tkpub-drop:active { border-color: var(--tk-accent); background: var(--tk-accent-soft); }
  .tkpub-card .tkpub-btn:active { opacity: .85; }

  /* Kills the 300ms click delay and the grey flash Android draws over any
     tapped control — both make an otherwise fast page feel unresponsive. */
  .tkpub:not(.tkpub-modal) button,
  .tkpub:not(.tkpub-modal) a,
  .tkpub:not(.tkpub-modal) label,
  .tkpub:not(.tkpub-modal) select { touch-action: manipulation; }
  .tkpub:not(.tkpub-modal) { -webkit-tap-highlight-color: rgba(0, 0, 0, 0); }

  /* The zone is a file-picker button here, not a drop target — nothing can
     be dragged onto it. The size constraint from the phone block still
     applies to a tablet, which otherwise inherits the desktop padding. */
  .tkpub-drop { min-height: 104px; }
}


/* ==========================================================================
   REDUCED MOTION
   publications.css already quiets the skeleton shimmer and the card
   transition. These are the animations this file introduces or relies on:
   the sideways facet strips, tap feedback and the toast entrance. Vestibular
   triggers are worse on a handheld screen held close to the face.
   ========================================================================== */

@media (prefers-reduced-motion: reduce) {

  /* Snapping is a motion effect of its own — a flick that keeps travelling
     and then slides back is exactly the kind of movement being opted out of. */
  .tkpub-facets {
    scroll-snap-type: none;
    scroll-behavior: auto;
  }

  .tkpub-chip,
  .tkpub-tag,
  .tkpub-btn,
  .tkpub-check span,
  .tkpub-drop,
  .tkpub-views button,
  .tkpub-switch .tkpub-track,
  .tkpub-switch .tkpub-track::after { transition: none; }

  .tkpub-chip:active { transform: none; }
  .tkpub-toast { animation: none; }
}

/* ==========================================================================
   Late additions from the viewer rewrite
   ========================================================================== */

@media (max-width: 640px) {
  /* The form's guidance moved out of the sticky button bar (admin.js), so it
     needs spacing of its own now that it is a standalone paragraph. */
  .tkpub-form-note {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--tk-line-soft);
    line-height: 1.55;
  }
}

            Document type  = child category of that parent

    ["#FB8518", "#C4490D"],   // the theme's blend of the two

    zoomOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8.5 11h5M20 20l-3.5-3.5"/></svg>',

    external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"/></svg>'

  /* ------------------------------------------------------------------ */
  /* REST plumbing                                                       */
  /* ------------------------------------------------------------------ */

  function restUrl(path, params) {
    var base = CONFIG.restRoot.replace(/\/+$/, "") + "/" + String(path).replace(/^\/+/, "");
    var qs = [];
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v === undefined || v === null || v === "") return;
      qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
    });
    return base + (qs.length ? (base.indexOf("?") > -1 ? "&" : "?") + qs.join("&") : "");
  }

    return fetch(restUrl(path, params), { credentials: "same-origin" }).then(function (res) {
      if (!res.ok) {
        return res.json().then(
          function (body) { throw new Error(body && body.message ? body.message : "HTTP " + res.status); },
          function () { throw new Error("HTTP " + res.status); }
        );
      }
      return res.json().then(function (data) {
        return { data: data, totalPages: Number(res.headers.get("X-WP-TotalPages") || 1) };
      });
    });
  }

  /* Pulls every page of a collection, up to CONFIG.maxFetch items. */
  function getAll(path, params) {
    var out = [];
    function page(n) {
      var p = Object.assign({}, params, { per_page: 100, page: n });
      return getJSON(path, p).then(function (r) {
        out = out.concat(r.data);
        if (n < r.totalPages && out.length < CONFIG.maxFetch) return page(n + 1);
        return out;
      });

    return page(1);

  /* Normalising both data modes into one publication shape              */
  /* ------------------------------------------------------------------ */

    var m = PAYLOAD_RE.exec(String(rendered || ""));
    if (!m) return {};
    try { return JSON.parse(m[1]); } catch (e) { return {}; }
  }

    return String(rendered || "").replace(PAYLOAD_RE, "");
  }

  function embeddedTerms(item) {
    var groups = (item._embedded && item._embedded["wp:term"]) || [];
    var all = [];
    groups.forEach(function (g) { if (Array.isArray(g)) all = all.concat(g); });
    return all;
  }

    var m = item._embedded && item._embedded["wp:featuredmedia"];
    if (!m || !m[0] || m[0].code) return { url: "", alt: "" };
    var media = m[0];

    var pick = sizes && (sizes.medium_large || sizes.large || sizes.medium);
    return { url: (pick && pick.source_url) || media.source_url || "", alt: media.alt_text || "" };
  }

      /* Plugin mode — the REST field does the work for us. */

        slug: item.slug,
        status: item.status,
        title: plain(item.title && item.title.rendered),
        summary: plain(item.excerpt && item.excerpt.rendered),
        date: item.date,
        link: item.link,
        pdf: item.tk.pdf_url || "",
        pages: Number(item.tk.pdf_pages) || 0,
        size: Number(item.tk.pdf_size) || 0,
        cover: item.tk.cover_url || "",
        coverAlt: item.tk.cover_alt || "",
        lang: item.tk.language || "en",

        downloads: Number(item.tk.downloads) || 0,

  /* State                                                               */
  /* ------------------------------------------------------------------ */

      '<div class="tkpub-cover-fallback" aria-hidden="true">' +
        '<span class="tkpub-cf-type">' + esc(pub.type) + "</span>" +
        '<span class="tkpub-cf-title">' + esc(clip(pub.title, 72)) + "</span>" +
        '<span class="tkpub-cf-mark">' + esc(CONFIG.org) + "</span>" +
      "</div>" +
      (showBadge && pub.pages ? '<span class="tkpub-cover-badge">' + pub.pages + ' pp</span>' : "") +
      "</div>";
  }

  function metaMarkup(pub) {
    var bits = [];
    bits.push("<span>" + ICON.cal + esc(prettyDate(pub.date)) + "</span>");
    if (pub.pages) bits.push("<span>" + ICON.page + pub.pages + " pages</span>");
    if (pub.size) bits.push("<span>" + ICON.down + esc(bytes(pub.size)) + "</span>");
    if (pub.lang && pub.lang !== "en") bits.push("<span>" + ICON.globe + esc(pub.langLabel) + "</span>");
    return '<div class="tkpub-meta">' + bits.join("") + "</div>";
  }

  function actionsMarkup(pub, small) {
    var sz = small ? " tkpub-btn-sm" : "";
    if (!pub.pdf) {
      return '<div class="tkpub-actions">' +
        '<a class="tkpub-btn tkpub-btn-ghost' + sz + '" href="' + esc(pub.link) + '">' + ICON.external + "Read online</a></div>";
    }
    return '<div class="tkpub-actions">' +
      '<button type="button" class="tkpub-btn tkpub-btn-primary' + sz + '" data-open="' + esc(pub.slug) + '">' +
        ICON.read + "Read</button>" +
      '<a class="tkpub-btn tkpub-btn-ghost' + sz + '" href="' + esc(pub.pdf) + '" download data-download="' + pub.id + '">' +
        ICON.down + "Download</a>" +
      "</div>";
  }

  function cardMarkup(pub) {
    return '<article class="tkpub-card">' +
      coverMarkup(pub, true) +
      '<div class="tkpub-card-body">' +
        '<p class="tkpub-type">' + esc(pub.type) + "</p>" +
        "<h3>" + esc(pub.title) + "</h3>" +
        '<p class="tkpub-summary">' + esc(pub.summary) + "</p>" +
        metaMarkup(pub) +
        (pub.themes.length
          ? '<div class="tkpub-tags">' + pub.themes.map(function (t) {
              return '<button type="button" class="tkpub-tag" data-theme="' + esc(t) + '">' + esc(t) + "</button>";
            }).join("") + "</div>"
          : "") +
      "</div>" +
      actionsMarkup(pub) +
      "</article>";
  }

  function featuredMarkup(pub) {
    return '<section class="tkpub-featured">' +
      coverMarkup(pub, false) +
      '<div class="tkpub-featured-body">' +
        '<span class="tkpub-flag">' + ICON.star + "Latest release</span>" +
        "<h3>" + esc(pub.title) + "</h3>" +
        "<p>" + esc(clip(pub.summary, 260)) + "</p>" +
        metaMarkup(pub) +
        actionsMarkup(pub) +
      "</div>" +
      "</section>";
  }

  function skeletons(n) {
    var one = '<div class="tkpub-skeleton"><div class="tkpub-sk-box"></div>' +
      '<div class="tkpub-sk-line" style="width:35%"></div>' +
      '<div class="tkpub-sk-line" style="width:92%"></div>' +
      '<div class="tkpub-sk-line" style="width:70%"></div></div>';
    return new Array(n + 1).join(one);
  }

  function stateBlock(icon, title, body, action, isError) {
    return '<div class="tkpub-state' + (isError ? " is-error" : "") + '">' + icon +
      "<h3>" + esc(title) + "</h3><p>" + esc(body) + "</p>" + (action || "") + "</div>";
  }

  /* ------------------------------------------------------------------ */
  /* Facets                                                              */
  /* ------------------------------------------------------------------ */

  function countBy(list, keyFn) {
    var map = {};
    list.forEach(function (p) {
      var keys = keyFn(p);
      (Array.isArray(keys) ? keys : [keys]).forEach(function (k) {
        if (!k) return;
        map[k] = (map[k] || 0) + 1;
      });
    });
    return map;
  }

  function renderFacets() {
    var types = countBy(state.all, function (p) { return p.type; });
    var themes = countBy(state.all, function (p) { return p.themes; });

    var typeHtml = ['<span class="tkpub-facet-label">Type</span>',
      '<button type="button" class="tkpub-chip" data-type="" aria-pressed="' + (!state.type) + '">All</button>'];
    Object.keys(types).sort().forEach(function (t) {
      typeHtml.push('<button type="button" class="tkpub-chip" data-type="' + esc(t) + '" aria-pressed="' +
        (state.type === t) + '">' + esc(t) + '<span class="tkpub-chip-count">' + types[t] + "</span></button>");
    });
    el.typeFacets.innerHTML = typeHtml.join("");

    var themeKeys = Object.keys(themes).sort(function (a, b) { return themes[b] - themes[a] || a.localeCompare(b); });
    var themeHtml = ['<span class="tkpub-facet-label">Theme</span>'];
    themeKeys.forEach(function (t) {
      themeHtml.push('<button type="button" class="tkpub-chip" data-theme="' + esc(t) + '" aria-pressed="' +
        (state.themes.indexOf(t) > -1) + '">' + esc(t) + '<span class="tkpub-chip-count">' + themes[t] + "</span></button>");
    });
    if (hasFilters()) {
      themeHtml.push('<button type="button" class="tkpub-reset" data-reset>Clear all filters</button>');
    }
    el.themeFacets.innerHTML = themeKeys.length > 1 ? themeHtml.join("") : (hasFilters()
      ? '<button type="button" class="tkpub-reset" data-reset>Clear all filters</button>' : "");

    /* Year + language selects */
    var years = Object.keys(countBy(state.all, function (p) { return p.year; }))
      .sort().reverse();
    el.year.innerHTML = '<option value="">All years</option>' + years.map(function (y) {
      return '<option value="' + esc(y) + '"' + (state.year === y ? " selected" : "") + ">" + esc(y) + "</option>";
    }).join("");

    var langs = Object.keys(countBy(state.all, function (p) { return p.lang; }));
    if (langs.length > 1) {
      el.lang.hidden = false;
      el.lang.innerHTML = '<option value="">All languages</option>' + langs.map(function (l) {
        return '<option value="' + esc(l) + '"' + (state.lang === l ? " selected" : "") + ">" +
          esc(CONFIG.languages[l] || l) + "</option>";
      }).join("");
    } else {
      el.lang.hidden = true;
    }
  }

  function hasFilters() {
    return !!(state.q || state.type || state.themes.length || state.year || state.lang);
  }

  /* ------------------------------------------------------------------ */
  /* Filter + paint                                                      */
  /* ------------------------------------------------------------------ */

  function applyFilters() {
    var q = state.q.toLowerCase().trim();
    var terms = q ? q.split(/\s+/) : [];

    state.filtered = state.all.filter(function (p) {
      if (state.type && p.type !== state.type) return false;
      if (state.year && p.year !== state.year) return false;
      if (state.lang && p.lang !== state.lang) return false;
      if (state.themes.length) {
        var ok = state.themes.every(function (t) { return p.keywords.indexOf(t) > -1; });
        if (!ok) return false;
      }
      /* Every word must appear somewhere — narrows sensibly as you type. */
      return terms.every(function (t) { return p.haystack.indexOf(t) > -1; });
    });

    var dir = state.sort === "oldest" ? 1 : -1;
    state.filtered.sort(function (a, b) {
      if (state.sort === "az") return a.title.localeCompare(b.title);
      if (state.sort === "za") return b.title.localeCompare(a.title);
      return (new Date(a.date) - new Date(b.date)) * dir;
    });

    state.shown = CONFIG.perPage;
    paint();
  }

  function paint() {
    var list = state.filtered;

    /* The newest publication gets the hero treatment, but only on an
       unfiltered, newest-first view — otherwise it is just noise. */
    var showFeatured = !hasFilters() && state.sort === "newest" && list.length > 2;
    var featured = null, rest = list;
    if (showFeatured) {
      featured = list.filter(function (p) { return p.featured; })[0] || list[0];
      rest = list.filter(function (p) { return p !== featured; });
    }

    el.featured.innerHTML = featured ? featuredMarkup(featured) : "";

    if (!list.length) {
      el.grid.className = "tkpub-grid";
      el.grid.innerHTML = "";
      el.empty.innerHTML = stateBlock(
        ICON.empty,
        hasFilters() ? "No publications match those filters" : "No publications yet",
